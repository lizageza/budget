    for (const it of its) {
      let sum = 0;
      h += `<tr><td>${esc(it.name)}</td>${keys.map(k => { const ln = month(k).lines[it.id]; const x = ln ? (mm === "p" ? ln.p : ln.a) : null; sum += +x || 0;

    }
    if (cat.id === "eseti") h += `<tr><td class="muted">Eseti tételek</td>${keys.map(k => { const s = Object.values(month(k).extras).reduce((a, e) => a + (+(mm === "p" ? e.p : e.a) || 0), 0); return `<td class="num">${s ? fmt(s, { noUnit: true }) : ""}</td>`; }).join("")}<td></td></tr>`;
  }

  stackedBars($("#yChart"), rows.map(({ k, c }) => ({ label: mkShort(k), full: mkName(k), cur: k === cur,
    values: Object.fromEntries(ecats.map(ec => [ec.id, mode === "p" ? (c.cats[ec.id] || {}).p : (c.cats[ec.id] || {}).a])) })), series, { id: "y", label: "Havi kiadások kategóriánként" });
}
$("#view-year").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    e.preventDefault();
    if (a.dataset.act === "ym") { S.yearMode = a.dataset.v; return renderYear(); }
    if (a.dataset.act === "mx") { S.matrix = a.dataset.v; return renderYear(); }
    if (a.dataset.act === "gomonth") { S.mk = a.dataset.k; return setTab("month"); }
    if (a.dataset.act === "csv") return exportCsv();
  }
  const td = e.target.closest("td[data-cell]");
  if (td && !td.querySelector("input")) {
    const [k, id] = td.dataset.cell.split("|"), ln = month(k).lines[id] || { p: 0 }, fld = S.matrix;
    td.innerHTML = `<input value="${ln[fld] ?? ""}" inputmode="numeric" aria-label="${esc(itemById(id).name)} ${mkName(k)}">`;
    const inp = td.querySelector("input"); inp.focus(); inp.select();
    const done = save => { if (!inp.isConnected) return; if (save) { const v = parseAmt(inp.value); if (!Number.isNaN(v)) {
          const mo = month(k), cur = mo.lines[id] || { p: 0 }, n = { ...cur };
          if (fld === "p") n.p = v || 0; else if (v == null) delete n.a; else n.a = v;
          mo.lines[id] = stamp(n); persist(); } }
        renderYear(); };
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") done(true); if (ev.key === "Escape") done(false);
      if (ev.key === "Tab") { ev.preventDefault(); const nxt = ev.shiftKey ? td.previousElementSibling : td.nextElementSibling; done(true); if (nxt && nxt.dataset.cell) setTimeout(() => { const n = document.querySelector(`td[data-cell="${nxt.dataset.cell}"]`); if (n) n.click(); }, 0); } });
    inp.addEventListener("blur", () => done(true));
  }
});
function exportCsv(){
  const keys = monthKeys(), sep = ";", q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [["Kategória","Tétel", ...keys.flatMap(k => [mkName(k) + " terv", mkName(k) + " tény"])].map(q).join(sep)];
  for (const it of items()) lines.push([q(catById(it.cat).name), q(it.name), ...keys.flatMap(k => { const l = month(k).lines[it.id]; return [l ? l.p : "", l && l.a != null ? l.a : ""]; })].join(sep));
  for (const k of keys) for (const e of Object.values(month(k).extras)) lines.push([q("Eseti"), q(e.name + " (" + mkName(k) + ")"), ...keys.flatMap(k2 => k2 === k ? [e.p, e.a ?? ""] : ["", ""])].join(sep));
  download(`budget-${today()}.csv`, "﻿" + lines.join("\r\n"), "text/csv");
}

/* ================= assets ================= */
function renderAssets(){
  const v = $("#view-assets"), A = D().assets, t = assetTotals(), px = A.px || {};
  const usd = fx("USD"), eur = fx("EUR");

$("#view-assets").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const A = D().assets, act = a.dataset.act;
  if (act === "px") return refreshPrices(false);
  if (act === "debtadd") return openDebtEntry(a.dataset.id);
  if (act === "debtnew") return openDebtNew();
  if (act === "debtdel") { const id = a.dataset.id, dt = A.debts[id]; if (!dt) return;
    const used = spends().some(s => s.pay === id) || monthKeys().some(k => Object.values(month(k).extras).some(x => x.debt === id));
    return withUndo(`${dt.name} törölve${used ? " (a hozzá rögzített költések megmaradnak)" : ""}.`, () => { delete A.debts[id]; D().deleted["assets/debts/" + id] = nowIso(); }); }
  if (act === "snap") { const t = assetTotals(), k = currentMk(); A.snaps[k] = stamp({ total: Math.round(t.total), net: Math.round(t.net), crypto: Math.round(t.crypto), stock: Math.round(t.stock), cash: Math.round(t.HUF + t.EUR + t.USD), raif: Math.round(t.raif), rev: Math.round(t.rev), debts: Math.round(t.debts), usd: fx("USD"), eur: fx("EUR") }); persist(); renderAssets(); return toast("Pillanatkép rögzítve: " + mkName(k)); }
  if (act === "addstock") { const id = uid("s"); A.stocks[id] = stamp({ sym: "", qty: 0 }); persist(); return renderAssets(); }
  if (act === "addcrypto") { const id = uid("c"); A.crypto[id] = stamp({ sym: "", qty: 0, cg: "" }); persist(); return renderAssets(); }
  if (act === "cg") { const c = A.crypto[a.dataset.id]; const v = prompt("CoinGecko-azonosító (pl. bitcoin, solana, bittensor):", c.cg || ""); if (v != null) { c.cg = v.trim().toLowerCase(); c.manual = false; stamp(c); persist(); refreshPrices(true); } return; }
  if (act === "del") { const g = a.dataset.g, id = a.dataset.id, before = A[g][id]; delete A[g][id]; D().deleted[`assets/${g}/${id}`] = nowIso(); persist(); renderAssets();
    return toast("Törölve.", () => { A[g][id] = stamp({ ...before }); delete D().deleted[`assets/${g}/${id}`]; persist(); renderAssets(); }); }
});

/* új hitelkártya: név, keret, mostani tartozás, havi törlesztő tervsor (meglévő vagy új) */
function openDebtNew(){
  const cands = items().filter(it => !it.off && !isIncomeCat(it.cat) && !Object.values(D().assets.debts).some(d => d.item === it.id));
  openDrawer(() => "Új hitelkártya", () => `
    <div class="field"><label for="nvN">Név</label><input class="inp" id="nvN" autocomplete="off" autofocus placeholder="pl. a bank neve"><span class="muted small">A fizetési módok között „&lt;név&gt;-kártya” lesz.</span></div>
    <div class="two"><div class="field"><label for="nvL">Keret</label><input class="inp num" id="nvL" inputmode="numeric" autocomplete="off" placeholder="Ft"></div>
      <div class="field"><label for="nvB">Tartozás most</label><input class="inp num" id="nvB" inputmode="numeric" autocomplete="off" placeholder="0"></div></div>
    <div class="field"><label for="nvI">Havi törlesztés tervsora</label><select class="inp" id="nvI"><option value="new">Új tervsor: „&lt;név&gt; hitelkártya törlesztés” (Megtakarítás &amp; hitel)</option><option value="">Nincs havi törlesztés (csak eseti)</option>${cands.map(it => `<option value="${esc(it.id)}">${esc(it.name)} (${esc((catById(it.cat) || {}).name || "")})</option>`).join("")}</select>
      <span class="muted small">A tervsor összegét a Hónap fülön vagy a Tételek fülön adod meg. A kifizetett törlesztés csökkenti a tartozást.</span></div>
    <div class="actions"><button class="btn primary" data-dr="save">${ICON.check} Felvétel</button></div>`);
  DR.handler = (what) => {
    if (what !== "save") return;
    const name = $("#nvN").value.trim(); if (!name) return toast("Add meg a kártya nevét.");
    if (Object.values(D().assets.debts).some(d => fold(d.name) === fold(name))) return toast("Ilyen nevű kártya már van.");
    const lim = parseAmt($("#nvL").value), bal = parseAmt($("#nvB").value);
    if (Number.isNaN(lim) || Number.isNaN(bal)) return toast("Nem értelmezhető összeg.");
    let item = $("#nvI").value;
    withUndo(`${name} hitelkártya felvéve.`, () => {
      if (item === "new") {
        item = uid("i"); const o = Math.max(0, ...D().items.map(i => i.o || 0)) + 10;
        D().items.push(stamp({ id: item, cat: catById("megt") ? "megt" : catOrder().find(c => c.kind !== "income").id, name: name + " hitelkártya törlesztés", o, rev: true }));
        for (const k of monthKeys().filter(k => k >= currentMk() && !month(k).meta.closed)) month(k).lines[item] = stamp({ p: 0, rev: true });
      }
      const id = uid("d"), dt = { id, name, ...(lim ? { limit: lim } : {}), ...(item ? { item } : {}), log: {} };
      debtSetBalance(dt, bal || 0);
      D().assets.debts[id] = dt; delete D().deleted["assets/debts/" + id];
    });
    closeDrawer();
  };
}

$("#view-items").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "additem") {
    const name = prompt("Az új tétel neve:"); if (!name || !name.trim()) return;
    const id = uid("i"), o = Math.max(0, ...D().items.map(i => i.o || 0)) + 10;
    D().items.push(stamp({ id, cat: a.dataset.cat, name: name.trim(), o, rev: true }));
    persist(); renderItems(); toast("Tétel felvéve. A meglévő hónapokban 0 Ft-tal szerepel, amíg be nem írod.");
  }
  if (a.dataset.act === "mpick") return openMonthPick(a.dataset.id);
  if (a.dataset.act === "itemdel") return deleteItem(a.dataset.id);
  if (a.dataset.act === "push") {
    const it = itemById(a.dataset.id), cur = currentMk();
    const ks = monthKeys().filter(k => k >= cur && !month(k).meta.closed);
    withUndo(`${it.name}: alapterv beírva ${ks.length} hónapba.`, () => {
      for (const k of ks) { const { m } = mkParse(k), mo = month(k);
        const pr = planOf(it, k), p = pr == null ? (it.plan || 0) : pr;
        mo.lines[it.id] = stamp({ ...(mo.lines[it.id] || {}), p, ...(it.rev && !mo.lines[it.id] ? { rev: true } : {}) }); }
    });
  }
});

const HU_MON3 = ["jan","febr","márc","ápr","máj","jún","júl","aug","szept","okt","nov","dec"];
function monthsSummary(it){
  if (it.dates) { const d = it.dates.slice().sort(); return d.length ? d.map(k => { const { y, m } = mkParse(k); return `${String(y).slice(2)}. ${HU_MON3[m - 1]}`; }).join(", ") : "válassz…"; }
  const m = (it.months || []).slice().sort((a, b) => a - b); return m.length ? m.map(x => HU_MON3[x - 1]).join(", ") : "válassz…";
}
/* hónapok kijelölése: évente ismétlődő (12 hónap) vagy konkrét hónapok (az aktuálistól 24 hónap + a már kijelölt korábbiak) */
function openMonthPick(id){
  const it = itemById(id), kind = ruleKind(it);
  let sel = new Set(kind === "dates" ? it.dates : it.months || []);
  const cur = currentMk();
  const opts = kind === "dates"
    ? [...new Set([...(it.dates || []).filter(k => k < cur), ...Array.from({ length: 24 }, (_, i) => mkAdd(cur, i))])].sort().map(k => [k, mkShort(k)])
    : HU_MON3.map((n, i) => [i + 1, cap(HU_MONTHS[i])]);
  openDrawer(() => esc(it.name) + ": hónapok", () => `
    <p class="muted small" style="margin:0">${kind === "dates" ? "Konkrét hónapok: csak a kijelöltekben szerepel, nem ismétlődik." : "Minden évben a kijelölt hónapokban szerepel."} A kijelölt hónapokban az Alapterv (${it.plan ? fmt(it.plan) : "még nincs megadva"}) kerül a tervbe, a többiben 0.</p>
    <div class="monpick">${opts.map(([v, n]) => `<button type="button" class="chipbtn" data-dr="t:${v}" aria-pressed="${sel.has(v)}">${esc(n)}</button>`).join("")}</div>
    <p class="muted small" style="margin:0">Mentéskor az aktuális és a már létrehozott, le nem zárt jövőbeli hónapok terve is igazodik; a lezárt hónapokhoz és a már kifizetett sorokhoz nem nyúlok.</p>
    <div class="actions"><button class="btn primary" data-dr="save">${ICON.check} Mentés</button></div>`);
  DR.handler = (what) => {
    if (what.startsWith("t:")) { const v = kind === "dates" ? what.slice(2) : +what.slice(2); sel.has(v) ? sel.delete(v) : sel.add(v);
      document.querySelectorAll(".monpick [data-dr]").forEach(b => b.setAttribute("aria-pressed", sel.has(kind === "dates" ? b.dataset.dr.slice(2) : +b.dataset.dr.slice(2)))); return; }
    if (what !== "save") return;
    let n = 0;
    withUndo(`${it.name}: hónapok mentve.`, () => {
      if (kind === "dates") it.dates = [...sel].sort(); else it.months = [...sel].sort((a, b) => a - b);
      stamp(it); n = syncItemPlan(it);
    });
    closeDrawer(); if (n) toast(`${it.name}: hónapok mentve, ${n} hónap terve igazítva.`);
  };
}
/* tétel törlése: csak ha az aktuális és későbbi hónapokban nincs rajta rögzített összeg és nem hitelkártya-törlesztés;
   ha volt korábbi terve, a múlt megmarad (a tétel kikapcsolva), különben teljesen törlődik */
function deleteItem(id){
  const it = itemById(id), cur = currentMk();
  const debt = Object.values(D().assets.debts).find(d => d.item === id);
  if (debt) return toast(`Nem törölhető: ez a(z) ${debt.name} kártya törlesztő sora. Előbb a kártyát töröld (Vagyon fül).`);
  const paid = monthKeys().filter(k => k >= cur && (ln => ln && (ln.a != null || ln.done))(month(k).lines[id]));
  if (paid.length) return toast(`Nem törölhető: ${paid.map(mkName).join(", ")} hónapban már van rajta rögzített összeg.`);
  const past = monthKeys().filter(k => k < cur && (ln => ln && ((+ln.p || 0) || ln.a != null))(month(k).lines[id]));
  if (!confirm(past.length ? `„${it.name}” törlése az aktuális hónaptól.\nA korábbi ${past.length} hónapban megmarad, a tétel kikapcsolva marad a listában.` : `„${it.name}” végleges törlése?`)) return;
  withUndo(`${it.name} törölve${past.length ? " az aktuális hónaptól" : ""}.`, () => {
    for (const k of monthKeys()) {
      const mo = month(k); if (!mo.lines[id]) continue;
      if (past.length && (k < cur || mo.meta.closed)) continue;
      delete mo.lines[id]; D().deleted[`months/${k}/lines/${id}`] = nowIso();
    }
    if (past.length) { it.off = true; stamp(it); }
    else { D().items = D().items.filter(x => x.id !== id); D().deleted["items/" + id] = nowIso(); if (D().statmap) delete D().statmap[id]; }
  });
}

/* ================= statisztika (csak a havi terv sorai alapján) ================= */
S.sf = { per: "cur", from: null, to: null, ns: false, q: "", g: "", sc: null, open: {}, sort: "d" };
function statMonths(){ return monthKeys().filter(k => k <= currentMk()); }
function statDates(){
  const f = S.sf, cur = currentMk(), all = statMonths(), t = new Date();
  const perFrom = k => periodStartStr(k), perTo = k => dstr(period(k).end);
  const calM = (y, m) => [dstr(new Date(y, m - 1, 1)), dstr(new Date(y, m, 0))];
  let from, to;
  if (f.per === "custom") { let a = f.from || all[0] || cur, b = f.to || cur; if (a > b) [a, b] = [b, a]; from = perFrom(a); to = perTo(b); }
  else if (f.per === "cur") { from = perFrom(cur); to = perTo(cur); }
  else if (f.per === "prev") { const p = mkAdd(cur, -1); from = perFrom(p); to = perTo(p); }
  else if (f.per === "cal") [from, to] = calM(t.getFullYear(), t.getMonth() + 1);
  else if (f.per === "prevcal") [from, to] = calM(t.getFullYear(), t.getMonth());
  else if (f.per === "year") { from = t.getFullYear() + "-01-01"; to = perTo(cur); }
  else if (f.per === "all") { from = perFrom(all[0] || cur); to = perTo(cur); }
  else { const n = +f.per || 6; from = perFrom(mkAdd(cur, -(n - 1))); to = perTo(cur); }
  return { from, to, a: mkOfDate(from), b: mkOfDate(to) };
}
function statRange(){ const d = statDates(); return [d.a, d.b]; }
function monthsIn(a, b){ const out = []; for (let k = a; k <= b; k = mkAdd(k, 1)) out.push(k); return out; }
function migrateFuel(){
  const st = D().settings; if ((st.mig || []).includes("fuel1")) return;
  const re = /uzemanyag|benzin|gazolaj|diesel|dizel|tankol|\btank\b/;
  const names = [];

}
function hbars(entries, total, opt){
  opt = opt || {};

  return `<div class="hb">${entries.map(([id, v, label, extra]) => `<div class="hbr ${opt.click ? "clk" : ""} ${extra && extra.sub ? "sub" : ""}" ${opt.click ? `data-hb="${esc(id)}" tabindex="0" role="button"` : ""} title="${esc(label)}: ${fmt(v)}${total ? " (" + (v / total * 100).toFixed(1) + "%)" : ""}">

      <span class="hbar"><i style="width:${(Math.max(v, 0) / max * 100).toFixed(1)}%;${extra && extra.color ? "background:" + extra.color : ""}"></i></span>
      <span class="hv num">${fmt(v, { noUnit: true })}</span><span class="hp num">${total ? (v / total * 100).toFixed(0) + "%" : ""}</span></div>`).join("")}</div>`;
}
function trendSeries(rows, ms){
  const f = S.sf, key = f.g ? "g:" + f.g : "all", hide = (f.hide = f.hide || {})[key] || {};
  let series, idOf;
  if (f.g) { const g = taxGroup(f.g); series = g.subs.map(([s, n], i) => ({ id: g.id + "." + s, name: n, short: n.split(",")[0], color: cssVar(SERIES[i % SERIES.length]) })); idOf = r => r.sc; }
  else { series = STACK.map((_, i) => ({ id: i, name: stackName(i), short: SHORT[i], color: stackColor(i) })); idOf = r => stackOf(groupOf(r.sc)); }
  const byK = {}, tot = {};
  for (const r of rows) { const id = idOf(r); (byK[r.k] = byK[r.k] || {})[id] = (byK[r.k][id] || 0) + r.amt; tot[id] = (tot[id] || 0) + r.amt; }
  series = series.filter(s => tot[s.id]);                       // üres sorozat nem kell
  const isHidden = id => !!hide[id];
  const visTotal = series.filter(s => !isHidden(s.id)).reduce((x, s) => x + tot[s.id], 0);
  return { series, byK, tot, isHidden, visTotal, hidden: series.some(s => isHidden(s.id)), key };
}
function catBars(el, items, total){
  if (!items.length) { el.innerHTML = `<p class="muted small" style="margin:0">Nincs adat.</p>`; return; }
  const W = 720, H = 260, ml = 44, mr = 6, mt = 22, mb = 34, iw = W - ml - mr, ih = H - mt - mb;
  const max = Math.max(1000, ...items.map(i => i.v)), step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = iw / items.length, bar = Math.min(54, bw * 0.62), y = v => mt + ih - v / top * ih;
  let g = ""; for (let v = 0; v <= top + step / 2; v += step) g += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v ? kFmt(v) : "0"}</text>`;
  let b = "";
  items.forEach((it, i) => {

/* minden kiadás egy sorban: tervezett tételek (lezárt időszakban a várható, a folyóban a kifizetett), eseti tételek, kártyadíjak */
function statRows(){
  const f = S.sf, { from, to, a, b } = statDates(), cur = currentMk(), q = fold(f.q);
  const inR = d => d >= from && d <= to;
  const rows = [], planInfo = [];
  for (const k of monthsIn(a, b)) {
    const mo = month(k); if (!mo || k > cur) continue;
    for (const l of monthLines(k)) {
      if (isIncomeCat(l.cat)) continue;
      const ld = lineDate(k, l.due); if (!inR(ld)) continue;
      const it = l.kind === "item" ? itemById(l.id) : null;
      const sc = it ? itemSc(it) : extraSc(mo.extras[l.id] || {});
      const p = l.p || 0, paid = k < cur ? expA(l) : (l.a != null ? l.a : (l.done ? p : 0)), rem = k < cur || l.done ? 0 : Math.max(p - (l.a || 0), 0);
      if (p || paid || rem) planInfo.push({ sc, name: l.name, p, paid, rem, pay: l.rev ? "rev" : "raif" });
      if (!paid) continue;
      rows.push({ k, ld, sc, name: l.name, pay: l.rev ? "rev" : "raif", amt: paid, kind: l.kind, lid: l.id, extra: l.kind === "extra" });
    }
    if (f.ns) { const c = calc(k), rv = c.rekaPaid ?? (k < cur ? c.reka : 0), ld = (mo.meta.rekaAt || "").slice(0, 10) || dstr(period(k).start); if (rv && inR(ld)) rows.push({ k, ld, sc: "reka.reka", name: pNak() + " utalás", pay: "raif", amt: rv }); }
  }
  for (const dt of Object.values(D().assets.debts)) for (const l of Object.values(dt.log || {})) {
    const d = (l.at || "").slice(0, 10); if (l.t !== "fee" || !inR(d)) continue;
    rows.push({ k: mkOfDate(d), ld: d, sc: "bank.kartya", name: (l.note || "Kártyadíj") + " (" + dt.name + ")", pay: dt.id, amt: +l.amt || 0 });
  }
  const pass = r => (f.ns || !(SUBS[r.sc] || {}).ns) && (!f.g || groupOf(r.sc) === f.g) && (!f.sc || r.sc === f.sc) && (!q || fold(r.name).includes(q));
  const out = rows.filter(pass);
  out.plan = planInfo.filter(pass);
  out.expected = out.plan.filter(r => !(SUBS[r.sc] || {}).ns).reduce((s, r) => s + r.rem, 0);
  return out;
}

function liteMigrate(){
  const now = nowIso(), A = D().assets;
  // 1. a mostani értékek a költésekkel együtt
  const debtsBefore = {}; for (const dt of Object.values(A.debts)) debtsBefore[dt.id] = debtRemaining(dt);
  const epBefore = epBalance();
  const epUsed = spends().some(s => s.pay === "ep");
  const debtUsed = new Set(spends().map(s => s.pay));
  for (const k of monthKeys()) { const sr = spendRevAfter(k); if (sr.sum) { const mo = month(k); mo.meta = stamp({ ...mo.meta, revolut: (+mo.meta.revolut || 0) - sr.sum, revAt: now }); } }
  // 2. törlés, sírkővel (a régi program se írja vissza)
  const n = Object.keys(D().spend || {}).length;
  for (const id of Object.keys(D().spend || {})) D().deleted["spend/" + id] = now;
  for (const w of Object.keys(D().learn || {})) D().deleted["learn/" + w] = now;
  D().spend = {}; D().learn = {};
  // 3. az egyenlegek visszaállítása a költések nélkül
  for (const dt of Object.values(A.debts)) if (debtUsed.has(dt.id) || Object.keys(dt.snap || {}).some(x => x.startsWith("s:"))) { debtSetBalance(dt, debtsBefore[dt.id]); }
  if (epUsed && epBefore != null) epSet(epBefore);
  const st = D().settings; st.mig = [...(st.mig || []), "lite1"]; stamp(st);
  return n;
}

/* ================= betűméret, billentyűk ================= */
const FONT_SIZES = [18, 20, 22, 26];
function fontSize(){ return LS.get("fs", matchMedia("(max-width:760px)").matches ? 18 : 20); }
function applyFontSize(){ document.documentElement.style.setProperty("--fs", fontSize() + "px"); }
function setFontSize(n){ LS.set("fs", n); applyFontSize(); renderAll(); }
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !S.data || DR.open || !$("#dlg").hidden || $("#tabs").hidden) return;
  const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const k = e.key, lk = k.toLowerCase();
  const tabs = { h: "month", "é": "year", s: "stats", v: "assets", t: "items", b: "settings" };
  if (tabs[lk]) { e.preventDefault(); return setTab(tabs[lk]); }
  if (lk === "f") { const i = FONT_SIZES.indexOf(fontSize()); setFontSize(FONT_SIZES[(i + 1) % FONT_SIZES.length]); return toast("Betűméret: " + fontSize() + " px"); }
  if (S.tab !== "month") return;
  if (k === "PageUp" || k === "PageDown") { e.preventDefault(); S.mk = mkAdd(S.mk, k === "PageUp" ? -1 : 1); return renderMonth(); }
  if (k === "ArrowDown" || k === "ArrowUp") {
    const all = monthLineKeys(); if (!all.length) return; e.preventDefault();
    let i = all.indexOf(S.sel); i = i < 0 ? 0 : (i + (k === "ArrowDown" ? 1 : -1) + all.length) % all.length; S.sel = all[i]; return markSel();
  }
  if ((k === " " || k === "Enter") && S.sel && !(a && a.tagName === "BUTTON")) {
    e.preventDefault(); const [kind, id] = S.sel.split(/:(.*)/s);
    return k === " " ? toggleLine(S.mk, kind, id) : openLine(S.mk, kind, id);
  }
});

boot();
