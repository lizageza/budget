      <span class="nm">${esc(l.name)}<span class="sub">${l.rev ? '<span class="chip rev">Revolut</span> ' : '<span class="chip">Raiffeisen</span> '}${l.a ? "eddig " + fmt(l.a) + " / " + fmt(l.p) : ""}</span></span>
      <span class="amt num">${fmt(remaining(l))}</span>
      <button class="ok" data-act="pay" data-id="${l.kind}:${esc(l.id)}" title="Kifizetve, lezárás" aria-label="${esc(l.name)} kifizetve">${ICON.check}</button>
    </li>`).join("")}</ul>` : `<div class="empty">Minden tétel rendezve ebben a hónapban.</div>`;
  h += `</div>`;
  h += debtCard();
  h += epCard();
  if (!mo.meta.closed) h += `<div><button class="btn" data-act="mclose">Hónap lezárása…</button></div>`;
  else h += `<div><button class="btn" data-act="mreopen">Hónap újranyitása</button></div>`;
  h += `</div><div class="col"><div class="card">`;
  // categories
  for (const cat of catOrder()) {
    const L = c.lines.filter(l => l.cat === cat.id && (S.showZero || l.p || l.a || cat.id === "eseti"));
    const cc = c.cats[cat.id] || { p: 0, a: 0 };
    if (!L.length && cat.id !== "eseti") continue;
    const inc = cat.kind === "income";
    const ratio = cc.p ? Math.min(cc.act / cc.p, 1) : (cc.act ? 1 : 0);
    const isOpen = S.open[cat.id] ?? LS.get("open." + cat.id, true);
    h += `<details class="cat" data-cat="${cat.id}" ${isOpen ? "open" : ""}><summary>
        <span class="ic" aria-hidden="true">${cat.icon || ""}</span><span class="nm">${esc(cat.name)}</span>
        <span class="sums num">${fmt(inc ? cc.a : cc.a)} <span class="t">/ ${fmt(cc.p, { noUnit: true })}</span></span>
        <span class="meter"><i class="${!inc && cc.act > cc.p ? "over" : ""}" style="width:${(ratio * 100).toFixed(1)}%"></i></span>
      </summary><div class="rows"><div class="rowhd"><span style="text-align:left">Tétel</span><span>Terv</span><span>Tény</span><span></span></div>`;
    for (const l of L) {
      const over = !inc && l.a != null && l.a > l.p;
      h += `<div class="row ${l.done ? "done" : ""} ${!l.p && !l.a ? "zero" : ""}" data-line="${l.kind}:${esc(l.id)}" tabindex="0">
        <span class="nm">${esc(l.name)}${l.due ? `<span class="sub">${l.due}.</span>` : ""}${l.lnote ? `<span class="sub">${esc(l.lnote)}</span>` : ""}</span>
        <span class="p num">${fmt(l.p, { noUnit: true })}</span>
        <span class="a num">${l.a == null ? "–" : fmt(l.a, { noUnit: true })}</span>
        <span class="fl">${l.rev ? '<span class="chip rev" title="Revolutról megy">R</span>' : ""}${l.done ? `<span class="chip done" title="Lezárva">${ICON.check.replace('<svg', '<svg width="12" height="12"')}</span>` : over ? '<span class="chip over" title="Túllépés">!</span>' : ""}</span>
      </div>`;
    }
    if (cat.id === "eseti") h += `<div class="addrow"><button class="btn sm" data-act="addextra">${ICON.plus} Eseti kiadás</button></div>`;
    h += `</div></details>`;
  }
  h += `</div></div></div>`;
  v.innerHTML = h;
}
$("#view-month").addEventListener("toggle", e => { const dc = e.target.closest("details.dcard"); if (dc) { S.open["debt." + dc.dataset.did] = dc.open; return; } const d = e.target.closest("details.cat"); if (d) { S.open[d.dataset.cat] = d.open; LS.set("open." + d.dataset.cat, d.open); } }, true);
$("#view-month").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "zero") { S.showZero = a.checked; return renderMonth(); }
    e.preventDefault();
    if (act === "mprev") { S.mk = mkAdd(S.mk, -1); return renderMonth(); }
    if (act === "mnext") { S.mk = mkAdd(S.mk, 1); return renderMonth(); }
    if (act === "mtoday") { S.mk = currentMk(); return renderMonth(); }
    if (act === "mcreate") { D().months[S.mk] = newMonthFrom(S.mk); persist(); renderAll(); return toast("Terv létrehozva."); }
    if (act === "pay") { const [kind, id] = a.dataset.id.split(/:(.*)/s); return payLine(S.mk, kind, id); }
    if (act === "addextra") return openExtraNew(S.mk);
    if (act === "reka") return openReka(S.mk);
    if (act === "px") return refreshPrices(false);
    if (act === "debtadd") return openDebtEntry(a.dataset.id);
    if (act === "dbook" || act === "dinc" || act === "dbal") {
      const dt = D().assets.debts[a.dataset.id]; S.open["debt." + dt.id] = true;
      if (act === "dbal") { const v = parseAmt($("#dbal-" + dt.id).value); if (v == null || Number.isNaN(v)) return toast("Add meg a bank szerinti tartozást."); return withUndo(`${dt.name}: egyenleg rögzítve, ${fmt(v)}.`, () => debtSetBalance(dt, v)); }
      if (act === "dbook") return withUndo(`${dt.name}: bekönyvelve, tartozás ${fmt(debtRemaining(dt))}.`, () => debtSetBalance(dt, debtRemaining(dt)));
      const pd = debtPending(dt);   // „már benne volt”: az egyenleg marad, a függő tételek kiesnek
      return withUndo(`${dt.name}: ${pd.rows.length} tétel kivéve, az egyenleg marad.`, () => { const keep = debtRemaining(dt) - pd.sum; debtSetBalance(dt, keep); });
    }
    if (act === "revbook" || act === "revinc") {
      const mo = month(S.mk), c = calc(S.mk), m = { ...mo.meta };
      if (act === "revbook") { m.revolut = c.revolut - c.spendRev.sum; }
      m.revAt = nowIso();
      return withUndo(act === "revbook" ? `Revolut-egyenleg: ${fmt(m.revolut)}.` : "A költések már benne voltak az egyenlegben.", () => { mo.meta = stamp(m); });
    }
    if (act === "receipt") return openReceipt();
    if (act === "quick") return openQuick();
    if (act === "gostats") { S.sf.per = "cur"; return setTab("stats"); }
    if (act === "perset") return openPeriod(S.mk);
    if (act === "mclose") return openClose(S.mk);
    if (act === "mreopen") { const mo = month(S.mk); mo.meta = stamp({ ...mo.meta, closed: false }); persist(); return renderAll(); }
    return;
  }
  const sp = e.target.closest("[data-spend]"); if (sp) return openSpendEdit(sp.dataset.spend);
  if (e.target.closest(".dcard")) return;
  const r = e.target.closest("[data-line]");
  if (r) { const [kind, id] = r.dataset.line.split(/:(.*)/s); openLine(S.mk, kind, id); }
});
$("#view-month").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".row")) e.target.click(); });

/* line editing */
function getRaw(k, kind, id){ const mo = month(k); return kind === "extra" ? mo.extras[id] : mo.lines[id]; }
function setLine(k, kind, id, patch){
  const mo = month(k), box = kind === "extra" ? mo.extras : mo.lines;
  const cur = box[id] || { p: 0 };
  const n = { ...cur, ...patch };
  for (const key of Object.keys(n)) if (n[key] === null || n[key] === undefined || n[key] === false || n[key] === "") delete n[key];
  if (n.p == null) n.p = 0;
  if (n.a != null || n.done) { if (!n.paidAt) n.paidAt = nowIso(); } else delete n.paidAt;   // mikor lett kifizetve (az EP-egyenleghez)
  box[id] = stamp(n);
  persist(); renderAll();
}
function payLine(k, kind, id){
  const raw = getRaw(k, kind, id) || { p: 0 };
  const before = JSON.stringify(raw);
  const a = raw.a != null && raw.a > 0 ? raw.a : raw.p;
  setLine(k, kind, id, { a, done: true });
  const nm = kind === "extra" ? raw.name : (itemById(id) || {}).name;
  toast(`${nm}: kifizetve, ${fmt(a)}`, () => { const mo = month(k), box = kind === "extra" ? mo.extras : mo.lines; box[id] = stamp(JSON.parse(before)); persist(); renderAll(); });
}

/* ================= drawer ================= */
const DR = { open: false, refresh: null };
function openDrawer(title, bodyFn, dynFn){
  const d = $("#drawer");
  DR.open = true;
  d.innerHTML = `<div class="dh"><h3 id="drTitle">${title()}</h3><button class="icon-btn" data-dr="close" aria-label="Bezárás">${ICON.close}</button></div><div class="db">${bodyFn()}${dynFn ? `<div id="drDyn" style="display:grid;gap:14px">${dynFn()}</div>` : ""}</div>`;
  // frissítéskor csak a számolt rész cserélődik, hogy a beviteli mezők (és a fókusz) megmaradjanak
  DR.refresh = () => { if (dynFn) { const el = $("#drDyn"); if (el) el.innerHTML = dynFn(); } $("#drTitle").innerHTML = title(); };
  d.classList.add("on"); $("#scrim").classList.add("on");
  setTimeout(() => { const f = d.querySelector("[autofocus]"); if (f && matchMedia("(min-width:761px)").matches) f.focus(); }, 60);
}
function closeDrawer(){ DR.open = false; DR.refresh = null; DR.handler = null; $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && DR.open) closeDrawer(); });
$("#drawer").addEventListener("click", e => { const b = e.target.closest("[data-dr]"); if (!b) return; if (b.dataset.dr === "close") return closeDrawer(); if (DR.handler) DR.handler(b.dataset.dr, b, e); });
$("#drawer").addEventListener("change", e => { if (DR.handler && e.target.dataset.fk) DR.handler("change:" + e.target.dataset.fk, e.target, e); });
$("#drawer").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input.inp")) { e.preventDefault(); if (e.target.dataset.fk === "add") { DR.handler && DR.handler("add", e.target, e); } else e.target.blur(); } });

function lineView(k, kind, id){
  const raw = getRaw(k, kind, id) || { p: 0 };
  const it = kind === "item" ? itemById(id) : null;
  const cat = catById(kind === "extra" ? (raw.cat || "eseti") : it.cat);
  const inc = cat && cat.kind === "income";
  const p = +raw.p || 0, a = raw.a == null ? null : +raw.a;
  const rem = raw.done ? 0 : Math.max(p - (a || 0), 0);
  let diff = "";
  if (!inc) diff = raw.done ? (a != null && a !== p ? `Lezárva · eltérés a tervtől: <b class="${a > p ? "neg" : "pos"}">${fmt(a - p, { sign: true })}</b>` : "Lezárva.") : a != null && a > p ? `Túllépés: <b class="neg">${fmt(a - p)}</b>` : `Hátralévő: <b>${fmt(rem)}</b>${raw.rev ? " · a keretből levonva" : ""}`;
  else diff = a == null ? "Tény nélkül a terv számít." : `Eltérés: <b>${fmt(a - p, { sign: true })}</b>`;
  return `
    ${kind === "extra" ? `<div class="field"><label for="dName">Megnevezés</label><input class="inp" id="dName" data-fk="name" value="${esc(raw.name || "")}" autocomplete="off"></div>` : ""}
    <div class="muted small">${esc(cat ? cat.name : "")} · ${mkName(k)}${it && it.note ? " · " + esc(it.note) : ""}</div>
    <div class="two">
      <div class="field"><label for="dP">Terv</label><input class="inp num" id="dP" data-fk="p" inputmode="numeric" value="${p || ""}" placeholder="0" autocomplete="off"></div>
      <div class="field"><label for="dA">Tény</label><input class="inp num" id="dA" data-fk="a" inputmode="numeric" value="${a == null ? "" : a}" placeholder="üres" autocomplete="off" autofocus></div>
    </div>
    <div class="field"><label for="dAdd">Hozzáadás a tényhez (pl. heti zsebpénz)</label>
      <div class="addline"><input class="inp num" id="dAdd" data-fk="add" inputmode="numeric" placeholder="összeg" autocomplete="off"><button class="btn" data-dr="add">${ICON.plus} Hozzáad</button></div></div>
    ${inc ? "" : `<label class="toggle"><input type="checkbox" data-fk="rev" ${raw.rev ? "checked" : ""}> Revolutról megy <span class="muted small">(beleszámít a keretbe)</span></label>
    <label class="toggle"><input type="checkbox" data-fk="done" ${raw.done ? "checked" : ""}> Lezárva <span class="muted small">(nem von le többet)</span></label>`}
    <div class="field"><label for="dNote">Megjegyzés ehhez a hónaphoz</label><input class="inp" id="dNote" data-fk="note" value="${esc(raw.note || "")}" autocomplete="off"></div>`;
}
function lineDyn(k, kind, id){
  const raw = getRaw(k, kind, id) || { p: 0 };
  const it = kind === "item" ? itemById(id) : null;
  const cat = catById(kind === "extra" ? (raw.cat || "eseti") : it.cat);
  const inc = cat && cat.kind === "income";
  const p = +raw.p || 0, a = raw.a == null ? null : +raw.a;
  const rem = raw.done ? 0 : Math.max(p - (a || 0), 0);
  let diff = "";
  if (!inc) diff = raw.done ? (a != null && a !== p ? `Lezárva · eltérés a tervtől: <b class="${a > p ? "neg" : "pos"}">${fmt(a - p, { sign: true })}</b>` : "Lezárva.") : a != null && a > p ? `Túllépés: <b class="neg">${fmt(a - p)}</b>` : `Hátralévő: <b>${fmt(rem)}</b>${raw.rev ? " · a keretből levonva" : ""}`;
  else diff = a == null ? "Tény nélkül a terv számít." : `Eltérés: <b>${fmt(a - p, { sign: true })}</b>`;
  return `<div class="diffline">${diff}</div>
    <div class="actions">
      ${!inc && !raw.done ? `<button class="btn primary" data-dr="pay">${ICON.check} Kifizetve${a ? " (" + fmt(a) + ")" : " a terv szerint"}</button>` : ""}
      ${kind === "extra" ? `<button class="btn" data-dr="del">${ICON.trash} Törlés</button>` : ""}
    </div>`;
}
function openLine(k, kind, id){
  const nm = () => { const raw = getRaw(k, kind, id); return esc(kind === "extra" ? (raw && raw.name) || "Eseti tétel" : itemById(id).name); };
  openDrawer(nm, () => lineView(k, kind, id), () => lineDyn(k, kind, id));
  DR.handler = (what, el) => {
    const raw = getRaw(k, kind, id) || { p: 0 };
    if (what === "change:p" || what === "change:a") {
      const v = parseAmt(el.value); if (Number.isNaN(v)) { toast("Nem értelmezhető összeg."); el.value = what === "change:p" ? (raw.p || "") : (raw.a ?? ""); return; }
      setLine(k, kind, id, what === "change:p" ? { p: v || 0 } : { a: v });
    }
    else if (what === "add") {
      const inp = $("#dAdd"), v = parseAmt(inp.value); if (!v) return;
      const na = (raw.a || 0) + v; setLine(k, kind, id, { a: na }); toast(`Hozzáadva: ${fmt(v)}`);
      $("#dA").value = na; inp.value = ""; inp.focus();
    }
    else if (what === "change:rev") setLine(k, kind, id, { rev: el.checked });
    else if (what === "change:done") setLine(k, kind, id, { done: el.checked });
    else if (what === "change:note") setLine(k, kind, id, { note: el.value.trim() });
    else if (what === "change:name") setLine(k, kind, id, { name: el.value.trim() || "Eseti tétel" });
    else if (what === "pay") { payLine(k, kind, id); closeDrawer(); }
    else if (what === "del") {
      const mo = month(k), before = mo.extras[id];
      delete mo.extras[id]; D().deleted[`months/${k}/extras/${id}`] = nowIso(); persist(); closeDrawer(); renderAll();
      toast("Törölve.", () => { mo.extras[id] = stamp({ ...before }); delete D().deleted[`months/${k}/extras/${id}`]; persist(); renderAll(); });
    }
  };
}
function openExtraNew(k){
  const id = uid("x"); month(k).extras[id] = stamp({ name: "", p: 0, rev: true });
  persist(); renderAll(); openLine(k, "extra", id);
  setTimeout(() => { const n = $("#dName"); if (n) n.focus(); }, 80);
}
function openReka(k){
  openDrawer(() => "Utalás Rékának", () => { const c = calc(k), mo = month(k); return `
    <div class="muted small">${mkName(k)} · a tervezett havi egyenleg (${fmt(c.bal.p)}) ${D().settings.rekaPct}%-a, ${D().settings.rekaMode === "round" ? "a legközelebbi" : "felfelé kerekítve a következő"} ${fmt(D().settings.rekaRound)}-re.</div>
    <div class="kpi" style="padding:0"><div class="k">Számított összeg</div><div class="v">${fmt(c.reka)}</div></div>
    <div class="field"><label for="dRk">Ténylegesen utalt összeg</label><input class="inp num" id="dRk" data-fk="paid" inputmode="numeric" value="${mo.meta.rekaPaid ?? ""}" placeholder="${c.reka}" autocomplete="off" autofocus></div>
    <div class="actions"><button class="btn primary" data-dr="exact">${ICON.check} Utalva: ${fmt(c.reka)}</button>${mo.meta.rekaPaid != null ? `<button class="btn" data-dr="clear">Nincs utalva</button>` : ""}</div>`; });
  DR.handler = (what, el) => {

    if (what === "clear") { const m = { ...mo.meta }; delete m.rekaPaid; mo.meta = stamp(m); persist(); closeDrawer(); renderAll(); }
    if (what === "change:paid") { const v = parseAmt(el.value); const m = { ...mo.meta }; if (v == null || Number.isNaN(v)) delete m.rekaPaid; else { m.rekaPaid = v; m.rekaAt = m.rekaAt || nowIso(); } mo.meta = stamp(m); persist(); renderAll(); }
  };
}
function openPeriod(k){
  const nk = mkAdd(k, 1), per = period(k);
  const def = kk => { const { y, m } = mkParse(kk); return dstr(new Date(y, m - 1, startDay())); };
  openDrawer(() => "Időszak: " + mkName(k), () => `
    <p class="muted small" style="margin:0">Alapból minden hónap a ${startDay()}-i naptól a következő hónap ${startDay() - 1}-i napjáig tart. Ha a fizetés máskor jön, itt átállíthatod. A kezdőnap az előző hónap végét, a végnap a következő hónap kezdetét is módosítja.</p>
    <div class="two"><div class="field"><label for="pS">Kezdőnap</label><input class="inp" id="pS" type="date" value="${dstr(per.start)}"></div>
      <div class="field"><label for="pE">Utolsó nap</label><input class="inp" id="pE" type="date" value="${dstr(per.end)}"></div></div>
    <div class="actions"><button class="btn primary" data-dr="ok">${ICON.check} Mentés</button><button class="btn" data-dr="reset">Alapértelmezett</button></div>`);
  DR.handler = (what) => {

/* shared change handler for inline inputs */
document.addEventListener("change", e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  const parts = f.split("|");
  const numv = () => { const v = parseAmt(el.value); if (Number.isNaN(v)) { toast("Nem értelmezhető szám."); return undefined; } return v; };
  if (f === "rev-bal") { const v = numv(); if (v === undefined) return; const mo = month(S.mk); const m = { ...mo.meta }; if (v == null) { delete m.revolut; delete m.revAt; } else { m.revolut = v; m.revAt = nowIso(); } mo.meta = stamp(m); persist(); return renderAll(); }
  const A = D().assets;
  if (parts[0] === "acct") { const v = numv(); if (v === undefined) return; const a = A.accounts[parts[1]]; a.bal = { ...a.bal, [parts[2]]: v }; stamp(a); persist(); return renderAll(); }
  if (parts[0] === "stock" || parts[0] === "crypto" || parts[0] === "debt") {
    const g = { stock: "stocks", crypto: "crypto", debt: "debts" }[parts[0]], o = A[g][parts[1]], fld = parts[2];
    if (["qty","start","limit"].includes(fld)) { const v = numv(); if (v === undefined) return; if (fld === "limit" && v == null) delete o.limit; else o[fld] = v; if (fld === "start") { o.baseAt = nowIso(); o.from = debtAutoFrom(o); } }
    else if (fld === "from") { o.from = el.value; o.baseAt = nowIso(); }
    else if (fld === "usd") { const v = numv(); if (v === undefined) return; if (v == null) { o.manual = false; } else { o.usd = v; o.manual = true; o.usdAt = nowIso(); } }
    else o[fld] = el.value.trim();
    stamp(o); persist(); return renderAll();
  }
  if (parts[0] === "item") {
    const it = itemById(parts[1]), fld = parts[2];
    if (fld === "name") it.name = el.value.trim() || it.name;
    else if (fld === "due") { const v = parseInt(el.value, 10); if (v >= 1 && v <= 31) it.due = v; else delete it.due; }
    else if (fld === "plan") { const v = numv(); if (v === undefined) return; if (v == null) delete it.plan; else it.plan = v; }
    else if (fld === "rule") { delete it.rule; delete it.months; if (el.value === "week") it.rule = { perMonday: it.plan || 0 }; if (el.value === "year") it.months = [1]; }
    else if (fld === "param") { const v = numv(); if (v === undefined) return; if (it.rule) it.rule = { perMonday: v || 0 }; else if (it.months) it.months = [Math.min(Math.max(v || 1, 1), 12)]; }
    else if (fld === "rev") { if (el.checked) it.rev = true; else delete it.rev; }
    else if (fld === "off") { if (!el.checked) it.off = true; else delete it.off; }
    else if (fld === "cat") it.cat = el.value;
    stamp(it); persist(); return renderAll();
  }
  if (parts[0] === "set") {
    const st = D().settings, fld = parts[1];
    if (["rekaPct","rekaRound","startDay","fxUSD","fxEUR"].includes(fld)) { const v = numv(); if (v === undefined) return; if (v == null) delete st[fld]; else st[fld] = v; }
    else if (el.type === "checkbox") st[fld] = el.checked;
    else { st[fld] = el.value.trim(); if (fld === "gemKey") LS.set("gemModels", null); }
    stamp(st); persist(); return renderAll();
  }
});

const EP = () => D().assets.ep || null;
const epRate = () => (+(D().settings.epRate) || 93.5) / 100;
/* a havi EP-befizetés tétele: amelyik a statisztikában „Egészségpénztár-befizetés” */
function epItem(){ return items().find(it => !it.off && itemSc(it) === "megt.ep") || items().find(it => itemSc(it) === "megt.ep") || null; }
/* az egyenleg megadása óta: kifizetett havi befizetések, eseti befizetések, adó-visszatérítés, EP-ből fizetett költések */
function epPending(){
  const ep = EP(); if (!ep) return { rows: [], sum: 0 };
  const base = ep.baseAt || "", rows = [], it = epItem(), r = epRate();
  if (it) for (const k of monthKeys()) { const ln = month(k).lines[it.id]; if (ln && ln.paidAt && ln.paidAt > base) { const v = +(ln.a ?? ln.p) || 0; if (v) rows.push({ at: ln.paidAt, txt: `Havi befizetés (${mkShort(k)}): ${fmt(v)} × ${fmtN(r * 100, 1)}%`, amt: Math.round(v * r) }); } }
  for (const [lid, l] of Object.entries(ep.log || {})) if ((l.at || "") > base) rows.push({ at: l.at, lid, txt: l.t === "tax" ? "Adó-visszatérítés" : `Eseti befizetés: ${fmt(l.amt)} × ${fmtN(r * 100, 1)}%`, amt: l.t === "tax" ? +l.amt : Math.round(+l.amt * r) });
  for (const s of spends()) if (s.pay === "ep" && (s.who || "geza") === "geza" && (s.at || "") > base) rows.push({ at: s.at, txt: s.shop || (s.lines[0] || {}).n || "Költés", amt: -spendHuf(s) });
  rows.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  return { rows, sum: rows.reduce((x, y) => x + y.amt, 0) };
}
function epBalance(){ const ep = EP(); return ep && ep.start != null ? (+ep.start || 0) + epPending().sum : null; }
function epSet(v){ D().assets.ep = stamp({ ...(EP() || {}), start: Math.round(v), baseAt: nowIso(), log: {} }); }

/* ================= charts (inline SVG) ================= */
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceStep(max){ const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p; return 10 * p; }
const kFmt = v => v >= 1e6 ? (v / 1e6).toLocaleString("hu-HU", { maximumFractionDigits: 1 }) + " M" : Math.round(v / 1000) + " e";
function stackedBars(el, cols, series, opt){
  // cols: [{key,label,cur,values:{sid:v}}], series: [{id,name,color}]
  const W = 720, H = 250, ml = 44, mr = 6, mt = 10, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  const tot = c => series.reduce((s, x) => s + Math.max(c.values[x.id] || 0, 0), 0);
  const max = Math.max(1, ...cols.map(tot)), step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = iw / cols.length, bar = Math.min(38, bw * 0.62);
  const y = v => mt + ih - v / top * ih;
  let g = "";
  for (let v = 0; v <= top + 1; v += step) g += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v ? kFmt(v) : "0"}</text>`;
  let bars = "", defs = "";
  cols.forEach((c, i) => {
    const x = ml + i * bw + (bw - bar) / 2, t = tot(c);
    if (t > 0) {
      defs += `<clipPath id="cp${opt.id}${i}"><rect x="${x}" y="${y(t)}" width="${bar}" height="${ih - (y(t) - mt) + 6}" rx="4"/></clipPath>`;
      let acc = 0, seg = "";
      for (const s of series) { const v = Math.max(c.values[s.id] || 0, 0); if (!v) continue; const y1 = y(acc + v), y0 = y(acc); seg += `<rect x="${x}" y="${y1}" width="${bar}" height="${Math.max(y0 - y1, 0)}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" paint-order="stroke"/>`; acc += v; }
      bars += `<g clip-path="url(#cp${opt.id}${i})">${seg}</g>`;
    }
    bars += `<text class="ax" x="${ml + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" ${c.cur ? 'style="font-weight:600;fill:var(--ink)"' : ""}>${esc(c.label)}</text>`;
    bars += `<rect class="hit" data-i="${i}" x="${ml + i * bw}" y="${mt}" width="${bw}" height="${ih}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}"><defs>${defs}</defs>${g}<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${bars}</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => {
    const h = e.target.closest(".hit"); if (!h) return tip.classList.remove("on");
    const c = cols[+h.dataset.i];
    tip.innerHTML = `<div class="h">${esc(c.full || c.label)}</div>` + series.filter(s => c.values[s.id]).slice().reverse().map(s => `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span class="num">${fmt(c.values[s.id])}</span></div>`).join("") + `<div class="r tot"><span>Összesen</span><span class="num">${fmt(tot(c))}</span></div>`;
    const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
    let lx = hb.left - box.left + hb.width / 2 + 12; if (lx + 190 > box.width) lx = hb.left - box.left + hb.width / 2 - 200;
    tip.style.left = Math.max(0, lx) + "px"; tip.style.top = "8px"; tip.classList.add("on");
  });
  svg.addEventListener("pointerleave", () => tip.classList.remove("on"));
}
function lineChart(el, pts, opt){
  const W = 720, H = 200, ml = 50, mr = 10, mt = 12, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  const vals = pts.map(p => p.v), lo0 = Math.min(...vals), hi0 = Math.max(...vals);
  const step = niceStep((hi0 - lo0) || hi0 || 1), lo = Math.floor(lo0 / step) * step, hi = Math.ceil(hi0 / step) * step || step;
  const x = i => ml + (pts.length === 1 ? iw / 2 : i / (pts.length - 1) * iw), y = v => mt + ih - (v - lo) / ((hi - lo) || 1) * ih;
  let g = ""; for (let v = lo; v <= hi + 1; v += step) g += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${kFmt(v)}</text>`;
  const path = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text><rect class="hit" data-i="${i}" x="${x(i) - iw / pts.length / 2}" y="${mt}" width="${iw / pts.length}" height="${ih}"/>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">${g}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => { const h = e.target.closest(".hit"); if (!h) return tip.classList.remove("on"); const p = pts[+h.dataset.i];
    tip.innerHTML = `<div class="h">${esc(p.full || p.label)}</div>${p.rows.map(r => `<div class="r"><span>${esc(r[0])}</span><span class="num">${fmt(r[1])}</span></div>`).join("")}`;
    const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect(); let lx = hb.left - box.left + hb.width / 2 + 12; if (lx + 190 > box.width) lx = hb.left - box.left + hb.width / 2 - 200;
    tip.style.left = Math.max(0, lx) + "px"; tip.style.top = "8px"; tip.classList.add("on"); });
  svg.addEventListener("pointerleave", () => tip.classList.remove("on"));
}

$("#view-year").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    e.preventDefault();
    if (a.dataset.act === "ym") { S.yearMode = a.dataset.v; return renderYear(); }
    if (a.dataset.act === "mx") { S.matrix = a.dataset.v; return renderYear(); }
    if (a.dataset.act === "gomonth") { S.mk = a.dataset.k; return setTab("month"); }
    if (a.dataset.act === "csv") return exportCsv();
  }
  const td = e.target.closest("td[data-cell]");
  if (td && !td.querySelector("input")) {
    const [k, id] = td.dataset.cell.split("|"), ln = month(k).lines[id] || { p: 0 }, fld = S.matrix;
    td.innerHTML = `<input value="${ln[fld] ?? ""}" inputmode="numeric" aria-label="${esc(itemById(id).name)} ${mkName(k)}">`;
    const inp = td.querySelector("input"); inp.focus(); inp.select();
    const done = save => { if (!inp.isConnected) return; if (save) { const v = parseAmt(inp.value); if (!Number.isNaN(v)) {
          const mo = month(k), cur = mo.lines[id] || { p: 0 }, n = { ...cur };
          if (fld === "p") n.p = v || 0; else if (v == null) delete n.a; else n.a = v;
          mo.lines[id] = stamp(n); persist(); } }
        renderYear(); };
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") done(true); if (ev.key === "Escape") done(false);
      if (ev.key === "Tab") { ev.preventDefault(); const nxt = ev.shiftKey ? td.previousElementSibling : td.nextElementSibling; done(true); if (nxt && nxt.dataset.cell) setTimeout(() => { const n = document.querySelector(`td[data-cell="${nxt.dataset.cell}"]`); if (n) n.click(); }, 0); } });
    inp.addEventListener("blur", () => done(true));
  }
});
function exportCsv(){
  const keys = monthKeys(), sep = ";", q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [["Kategória","Tétel", ...keys.flatMap(k => [mkName(k) + " terv", mkName(k) + " tény"])].map(q).join(sep)];
  for (const it of items()) lines.push([q(catById(it.cat).name), q(it.name), ...keys.flatMap(k => { const l = month(k).lines[it.id]; return [l ? l.p : "", l && l.a != null ? l.a : ""]; })].join(sep));
  for (const k of keys) for (const e of Object.values(month(k).extras)) lines.push([q("Eseti"), q(e.name + " (" + mkName(k) + ")"), ...keys.flatMap(k2 => k2 === k ? [e.p, e.a ?? ""] : ["", ""])].join(sep));
  download(`budget-${today()}.csv`, "﻿" + lines.join("\r\n"), "text/csv");
}

/* ================= statisztika ================= */
S.sf = S.sf || { per: "6", from: null, to: null, src: { plan: true, geza: true, reka: true }, ns: false, q: "", g: "", open: {}, sort: "d" };
function statMonths(){
  const set = new Set(monthKeys().filter(k => k <= currentMk()));
  for (const s of spends()) set.add(mkOfDate(s.d));
  return [...set].sort();
}
/* a szűrt időszak dátumokkal: { from, to } (YYYY-MM-DD), és az érintett költségvetési hónapok [a, b] */
function statDates(){
  const f = S.sf, cur = currentMk(), all = statMonths(), t = new Date();
  const perFrom = k => periodStartStr(k), perTo = k => dstr(period(k).end);
  const calM = (y, m) => [dstr(new Date(y, m - 1, 1)), dstr(new Date(y, m, 0))];
  let from, to;
  if (f.per === "custom") { let a = f.from || all[0] || cur, b = f.to || cur; if (a > b) [a, b] = [b, a]; from = perFrom(a); to = perTo(b); }
  else if (f.per === "cur") { from = perFrom(cur); to = perTo(cur); }
  else if (f.per === "prev") { const p = mkAdd(cur, -1); from = perFrom(p); to = perTo(p); }
  else if (f.per === "cal") [from, to] = calM(t.getFullYear(), t.getMonth() + 1);
  else if (f.per === "prevcal") [from, to] = calM(t.getFullYear(), t.getMonth());
  else if (f.per === "year") { from = t.getFullYear() + "-01-01"; to = perTo(cur); }
  else if (f.per === "all") { from = perFrom(all[0] || cur); to = perTo(cur); }
  else { const n = +f.per || 6; from = perFrom(mkAdd(cur, -(n - 1))); to = perTo(cur); }
  return { from, to, a: mkOfDate(from), b: mkOfDate(to) };
}
function statRange(){ const d = statDates(); return [d.a, d.b]; }
function monthsIn(a, b){ const out = []; for (let k = a; k <= b; k = mkAdd(k, 1)) out.push(k); return out; }
/* a tervezett tétel dátuma: a terhelés napja az időszakon belül, ennek hiányában az időszak első napja */
function lineDate(k, due){
  const per = period(k); if (!due) return dstr(per.start);
  let d = new Date(per.start.getFullYear(), per.start.getMonth(), due); if (d < per.start) d = new Date(per.start.getFullYear(), per.start.getMonth() + 1, due);
  if (d > per.end) d = per.end; return dstr(d);
}
/* minden költés egy sorban: tervezett tételek (tény, nyitottnál a terv), eseti tételek, rögzített költések, kártyadíjak */
function statRows(){
  const f = S.sf, { from, to, a, b } = statDates(), cur = currentMk(), q = fold(f.q);
  const inR = d => d >= from && d <= to;
  const rows = []; let expected = 0;
  for (const k of monthsIn(a, b)) {
    const mo = month(k);
    if (mo && f.src.plan && k <= cur) {
      for (const l of monthLines(k)) {
        if (isIncomeCat(l.cat)) continue;
        const ld = lineDate(k, l.due); if (!inR(ld)) continue;
        // a folyó időszakban csak a ténylegesen kifizetett (beírt vagy lezárt) tétel számít költésnek, a többi „még várható”
        if (k >= cur && l.a == null && !l.done) { if (!(SUBS[l.kind === "item" ? itemSc(itemById(l.id)) : "egyeb.egyeb"] || {}).ns) expected += l.p || 0; continue; }
        const v = k >= cur ? (l.a != null ? l.a : l.p) : expA(l); if (!v) continue;
        const it = l.kind === "item" ? itemById(l.id) : null;
        const sc = it ? itemSc(it) : extraSc(mo.extras[l.id] || {});
        rows.push({ k, d: null, ld, src: "plan", who: "plan", sc, name: l.name, shop: "", pay: l.rev ? "rev" : "raif", amt: v, p: l.kind === "item" ? l.p : null, kind: l.kind, lid: l.id, open: !l.done && l.a == null });
      }
      if (f.ns) { const c = calc(k), rv = c.rekaPaid ?? (k < cur ? c.reka : 0), ld = (mo.meta.rekaAt || "").slice(0, 10) || dstr(period(k).start); if (rv && inR(ld)) rows.push({ k, d: null, ld, src: "plan", who: "plan", sc: "reka.reka", name: "Rékának utalás", shop: "", pay: "raif", amt: rv }); }
    }
  }
  for (const s of spends()) {
    const who = s.who || "geza";
    if (!inR(s.d || "") || !f.src[who]) continue;
    const k = mkOfDate(s.d);
    for (const l of s.lines || []) rows.push({ k, d: s.d, src: "spend", who, sc: l.sc, name: l.n, shop: s.shop || "", pay: s.pay, amt: (+l.a || 0) * (s.rate || 1), sid: s.id, note: s.note || "" });
  }
  // hitelkártyák naplójába írt díjak
  if (f.src.geza) for (const dt of Object.values(D().assets.debts)) for (const l of Object.values(dt.log || {})) {
    const d = (l.at || "").slice(0, 10); if (l.t !== "fee" || !inR(d)) continue;
    rows.push({ k: mkOfDate(d), d, src: "spend", who: "geza", sc: "bank.kartya", name: (l.note || "Kártyadíj") + " (" + dt.name + ")", shop: dt.name, pay: dt.id, amt: +l.amt || 0 });
  }
  const out = rows.filter(r => (f.ns || !(SUBS[r.sc] || {}).ns) && (!f.g || groupOf(r.sc) === f.g) && (!q || fold(r.name + " " + r.shop + " " + (r.note || "")).includes(q)));
  out.expected = (f.g || q) ? 0 : expected;
  return out;
}
/* egyszeri: az „Egyéb”-be került banki díjak átsorolása */
function migrateBank(){
  const st = D().settings; if ((st.mig || []).includes("bank1")) return;
  let n = 0;
  for (const [id, s] of Object.entries(D().spend || {})) {
    let ch = false; const lines = (s.lines || []).map(l => { if (l.sc === "egyeb.egyeb") { const g = guessSc(l.n); if (g && g.startsWith("bank.")) { ch = true; n++; return { ...l, sc: g }; } } return l; });
    if (ch) D().spend[id] = stamp({ ...s, lines });
  }
  st.mig = [...(st.mig || []), "bank1"]; stamp(st);
  if (n) { persist(); toast(`${n} banki díj átkerült a „Banki díjak” kategóriába.`); }
}
const sumBy = (rows, key) => { const m = {}; for (const r of rows) { const k = typeof key === "function" ? key(r) : r[key]; m[k] = (m[k] || 0) + r.amt; } return m; };
function hbars(entries, total, opt){
  opt = opt || {};
  const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="hb">${entries.map(([id, v, label, extra]) => `<div class="hbr ${opt.click ? "clk" : ""} ${extra && extra.sub ? "sub" : ""}" ${opt.click ? `data-hb="${esc(id)}" tabindex="0" role="button"` : ""} title="${esc(label)}: ${fmt(v)}${total ? " (" + (v / total * 100).toFixed(1) + "%)" : ""}">
      <span class="hl">${extra && extra.caret != null ? `<span class="caret">${extra.caret ? "▾" : "▸"}</span>` : ""}${esc(label)}</span>
      <span class="hbar"><i style="width:${(Math.max(v, 0) / max * 100).toFixed(1)}%;${extra && extra.color ? "background:" + extra.color : ""}"></i></span>
      <span class="hv num">${fmt(v, { noUnit: true })}</span><span class="hp num">${total ? (v / total * 100).toFixed(0) + "%" : ""}</span></div>`).join("")}</div>`;
}
function renderStats(){
  const v = $("#view-stats"), f = S.sf, sd = statDates(), a = sd.a, b = sd.b, ms = monthsIn(a, b), cur = currentMk(), all = statMonths();
  const rows = statRows();
  const spendRows = rows.filter(r => !(SUBS[r.sc] || {}).ns);
  const total = spendRows.reduce((s, r) => s + r.amt, 0);
  const nM = ms.length || 1;
  const etk = spendRows.filter(r => groupOf(r.sc) === "etk").reduce((s, r) => s + r.amt, 0);
  const junkRows = spendRows.filter(r => r.sc === "etk.nasi" || r.sc === "etk.alk"), junk = junkRows.reduce((s, r) => s + r.amt, 0);
  const own = rows.filter(r => r.src === "spend");
  const nRec = new Set(own.map(r => r.sid)).size;
  // lefedettség: neked maradt (terv) vs saját rögzített költés
  let left = 0; for (const k of ms) { const c = month(k) && k <= cur ? calc(k) : null; if (c) left += Math.max(c.bal.p - (c.rekaPaid ?? c.reka), 0); }
  const inD = s => (s.d || "") >= sd.from && (s.d || "") <= sd.to;
  const ownG = spends().filter(s => (s.who || "geza") === "geza" && inD(s)).reduce((x, s) => x + spendHuf(s), 0);
  const rekaT = ms.reduce((x, k) => { const c = month(k) && k <= cur ? calc(k) : null; return x + (c ? (c.rekaPaid ?? (k < cur ? c.reka : 0)) : 0); }, 0);
  const rekaS = spends().filter(s => s.who === "reka" && inD(s)).reduce((x, s) => x + spendHuf(s), 0);
  const opt = (k, sel) => `<option value="${k}" ${k === sel ? "selected" : ""}>${mkName(k)}</option>`;
  const dl = s => s.replace(/-/g, ".") + ".";
  let h = `<div class="mhead"><h1>Statisztika</h1><span class="per">${dl(sd.from)} – ${dl(sd.to)}${nM > 1 ? " · " + nM + " időszak" : ""}</span></div>
  <div class="sfbar">
    <select class="inp" data-sf="per" aria-label="Időszak">${[["cur",`Aktuális időszak (${dshort(period(cur).start)}–${dshort(period(cur).end)})`],["prev","Előző időszak"],["cal","Aktuális naptári hónap"],["prevcal","Előző naptári hónap"],["3","Utolsó 3 időszak"],["6","Utolsó 6 időszak"],["12","Utolsó 12 időszak"],["year","Idei év"],["all","Teljes időszak"],["custom","Egyedi…"]].map(([k, n]) => `<option value="${k}" ${f.per === k ? "selected" : ""}>${n}</option>`).join("")}</select>
    ${f.per === "custom" ? `<select class="inp" data-sf="from" aria-label="Ettől">${all.map(k => opt(k, a)).join("")}</select><select class="inp" data-sf="to" aria-label="Eddig">${all.map(k => opt(k, b)).join("")}</select>` : ""}
    <select class="inp" data-sf="g" aria-label="Főcsoport"><option value="">Minden csoport</option>${TAX.filter(g => f.ns || !g.ns).map(g => `<option value="${g.id}" ${f.g === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select>
    <input class="inp grow" type="search" data-sf="q" value="${esc(f.q)}" placeholder="Keresés: tétel, bolt (pl. Hell, Lidl)" aria-label="Keresés">
    <div class="chips">${[["plan","Tervezett tételek"],["geza","Saját költés"],["reka","Réka költése"]].map(([k, n]) => `<button class="chipbtn" data-sfsrc="${k}" aria-pressed="${!!f.src[k]}">${n}</button>`).join("")}
      <button class="chipbtn" data-sfns aria-pressed="${f.ns}">Nem költés is</button></div>
  </div>`;
  h += `<div class="kpis k5">
    <div class="kpi"><div class="k">Összes költés</div><div class="v">${fmt(total)}</div><div class="s">${nM > 1 ? "havi átlag " + fmt(total / nM) : spendRows.length + " tétel"}${rows.expected ? ` · még várható ${fmt(rows.expected)} (tervezett, nincs kifizetve)` : ""}</div></div>
    <div class="kpi"><div class="k">Nasi és alkohol</div><div class="v">${fmt(junk)}</div><div class="s">${etk ? (junk / etk * 100).toFixed(0) + "% az étkezésből" : "–"}${nM > 1 ? " · havi " + fmt(junk / nM) : ""}</div></div>
    <div class="kpi"><div class="k">Rögzített költés</div><div class="v">${fmt(own.reduce((s, r) => s + r.amt, 0))}</div><div class="s">${nRec} blokk / bevitel</div></div>
    <div class="kpi"><div class="k">Neked maradt / rögzítve</div><div class="v">${left ? Math.round(ownG / left * 100) + "%" : "–"}</div><div class="s">${fmt(ownG)} / ${fmt(left)}</div></div>
    <div class="kpi"><div class="k">Rékának utalva / részletezve</div><div class="v">${rekaT ? Math.round(rekaS / rekaT * 100) + "%" : "–"}</div><div class="s">${fmt(rekaS)} / ${fmt(rekaT)}${rekaT > rekaS ? " · nem részletezett " + fmt(rekaT - rekaS) : ""}</div></div>
  </div>`;
  // mire megy
  const byG = sumBy(spendRows.concat(f.ns ? rows.filter(r => (SUBS[r.sc] || {}).ns) : []), r => groupOf(r.sc));
  const gEntries = Object.entries(byG).sort((x, y) => y[1] - x[1]);
  const bars = [];
  for (const [g, val] of gEntries) {
    const isOpen = !!f.open[g], gg = taxGroup(g);
    bars.push([g, val, gg.name, { caret: isOpen }]);
    if (isOpen) { const bs = sumBy(rows.filter(r => groupOf(r.sc) === g), "sc"); for (const [sc, sv] of Object.entries(bs).sort((x, y) => y[1] - x[1])) bars.push(["sc:" + sc, sv, SUBS[sc].name, { sub: true, color: "color-mix(in srgb,var(--accent) 55%,var(--surface))" }]); }
  }
  h += `<div class="sgrid"><div class="card"><div class="hd"><h2>Mire megy a pénz</h2><span class="muted small">kattints egy csoportra a részletekhez</span></div><div class="bd">${gEntries.length ? hbars(bars, total, { click: true }) : `<div class="empty">Nincs adat a szűrésre.</div>`}</div>
    ${f.selSc ? scDetail(rows, f.selSc) : ""}</div>`;
  // havi trend
  h += `<div class="card"><div class="hd"><h2>Havi trend</h2><span class="muted small">főcsoportonként</span></div><div class="bd"><div class="chart" id="stTrend"></div></div>
    <div class="legend">${STACK.map((_, i) => `<span><i style="background:${stackColor(i)}"></i>${esc(stackName(i))}</span>`).join("")}</div></div>`;
  // nasi és alkohol
  h += `<div class="card"><div class="hd"><h2>Nasi és alkohol havonta</h2><span class="muted small">${nM > 1 ? "átlag " + fmt(junk / nM) + "/hó" : ""}</span></div><div class="bd"><div class="chart" id="stJunk"></div></div>
    <div class="legend"><span><i style="background:${cssVar("--s2")}"></i>Nasi és üdítő</span><span><i style="background:${cssVar("--s7")}"></i>Alkohol</span></div>
    ${junkRows.length ? `<div class="bd" style="padding-top:0"><div class="k" style="margin-bottom:6px">Leggyakoribb</div>${topTable(junkRows, "name", 6)}</div>` : ""}</div>`;
  // terv és tény
  const planRows = rows.filter(r => r.src === "plan" && r.p != null);
  if (planRows.length) {
    const pg = {}; for (const r of planRows) { const g = groupOf(r.sc); pg[g] = pg[g] || { p: 0, a: 0 }; pg[g].p += r.p; pg[g].a += r.amt; }
    h += `<div class="card"><div class="hd"><h2>Tervezett tételek: terv és tény</h2></div><div class="tblwrap"><table class="t"><thead><tr><th>Csoport</th><th>Terv</th><th>Tény / várható</th><th>Eltérés</th></tr></thead><tbody>
      ${Object.entries(pg).sort((x, y) => y[1].a - x[1].a).map(([g, o]) => `<tr><td>${esc(taxGroup(g).name)}</td><td class="num">${fmt(o.p, { noUnit: true })}</td><td class="num">${fmt(o.a, { noUnit: true })}</td><td class="num ${o.a > o.p ? "neg" : o.a < o.p ? "pos" : ""}">${fmt(o.a - o.p, { sign: true, noUnit: true })}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  // boltok, tételek, fizetés
  const sp = rows.filter(r => r.src === "spend");
  if (sp.length) {
    const shops = {}; for (const s of spends()) { if (!inD(s) || !f.src[s.who || "geza"] || !s.shop) continue; const o = shops[s.shop] = shops[s.shop] || { n: 0, v: 0 }; o.n++; o.v += spendHuf(s); }
    h += `<div class="card"><div class="hd"><h2>Boltok</h2></div><div class="tblwrap"><table class="t"><thead><tr><th>Bolt</th><th>Alkalom</th><th>Összeg</th></tr></thead><tbody>${Object.entries(shops).sort((x, y) => y[1].v - x[1].v).slice(0, 10).map(([n, o]) => `<tr><td><a href="#" data-sq="${esc(n)}">${esc(n)}</a></td><td class="num">${o.n}</td><td class="num">${fmt(o.v, { noUnit: true })}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">Nincs bolt megadva.</td></tr>`}</tbody></table></div></div>`;
    h += `<div class="card"><div class="hd"><h2>Leggyakoribb tételek</h2></div><div class="bd">${topTable(sp, "name", 10)}</div></div>`;
    const byPay = sumBy(sp, "pay");
    h += `<div class="card"><div class="hd"><h2>Fizetési mód</h2><span class="muted small">rögzített költések</span></div><div class="bd">${hbars(Object.entries(byPay).sort((x, y) => y[1] - x[1]).map(([k, val]) => [k, val, payName(k)]), sp.reduce((s, r) => s + r.amt, 0))}</div></div>`;
  }
  h += `</div>`;
  // tételek listája
  const list = rows.slice().sort((x, y) => S.sf.sort === "a" ? y.amt - x.amt : ((y.d || y.ld || "").localeCompare(x.d || x.ld || "")));
  h += `<div class="card" style="margin-top:16px"><div class="hd"><h2>Tételek</h2><span class="muted small">${list.length} sor · ${fmt(list.reduce((s, r) => s + r.amt, 0))}</span><span class="spacer" style="flex:1"></span>
    <div class="seg"><button data-sfsort="d" aria-pressed="${S.sf.sort !== "a"}">Dátum</button><button data-sfsort="a" aria-pressed="${S.sf.sort === "a"}">Összeg</button></div><button class="btn sm" data-act="stcsv">CSV</button></div>
    <div class="tblwrap" style="max-height:60vh"><table class="t"><thead><tr><th>Dátum</th><th class="tx">Tétel</th><th class="tx">Bolt</th><th class="tx">Kategória</th><th class="tx">Forrás</th><th>Összeg</th></tr></thead><tbody>
    ${list.slice(0, 400).map(r => `<tr ${r.sid ? `data-sid="${esc(r.sid)}" class="clk"` : ""}><td class="num">${(r.d || r.ld) ? (r.d || r.ld).slice(5).replace("-", ".") + "." : mkShort(r.k)}</td><td class="tx nm">${esc(r.name)}</td><td class="tx">${esc(r.shop)}</td><td class="tx">${esc((SUBS[r.sc] || {}).name || "")}</td><td class="tx"><span class="chip">${r.src === "plan" ? "terv" : r.who === "reka" ? "Réka" : payName(r.pay)}</span></td><td class="num">${fmt(r.amt, { noUnit: true })}</td></tr>`).join("")}
    ${list.length > 400 ? `<tr><td colspan="6" class="muted">… és még ${list.length - 400} sor (szűkíts, vagy töltsd le CSV-ben).</td></tr>` : ""}</tbody></table></div></div>`;
  // besorolás és import
  h += `<div class="sgrid" style="margin-top:16px"><div class="card"><div class="hd"><h2>A tervezett tételek besorolása</h2></div><div class="bd muted small" style="padding-bottom:6px">A Hónap fül felosztása nem változik, ez csak a statisztikát érinti.</div><div class="smap">
    ${items().filter(it => !isIncomeCat(it.cat)).map(it => `<label class="${it.off ? "off" : ""}"><span>${esc(it.name)}</span><select class="inp" data-smap="${esc(it.id)}">${scOptions(itemSc(it), true)}</select></label>`).join("")}</div></div>
    <div class="card"><div class="hd"><h2>Eseti tételek és import</h2></div><div class="bd" style="display:grid;gap:12px">
      <p class="muted small" style="margin:0">${(() => { const n = extrasUnclassified().length; return n ? `${n} eseti tétel még automatikus (kulcsszavas) besorolású.` : "Minden eseti tétel be van sorolva."; })()}</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn" data-act="aiextras" ${extrasUnclassified().length ? "" : "disabled"}>Eseti tételek besorolása AI-val</button><button class="btn" data-act="rekaimp">Réka exportjának betöltése…</button></div>
      <p class="muted small" style="margin:0">Réka oldala egy <code>.json</code> fájlt ad. Ugyanazt többször is betöltheted, nem duplázódik.</p>
      ${extrasList()}
    </div></div></div>`;
  v.innerHTML = h;
  // diagramok
  const cols = ms.map(k => { const vals = {}; for (const r of spendRows) if (r.k === k) { const i = stackOf(groupOf(r.sc)); vals[i] = (vals[i] || 0) + r.amt; } return { label: mkShort(k), full: mkName(k), cur: k === cur, values: vals }; });
  const series = STACK.map((_, i) => ({ id: i, name: stackName(i), color: stackColor(i) }));
  if (ms.length) stackedBars($("#stTrend"), cols, series, { id: "st", label: "Havi költés főcsoportonként" });
  const jc = ms.map(k => { const vals = { n: 0, a: 0 }; for (const r of junkRows) if (r.k === k) vals[r.sc === "etk.alk" ? "a" : "n"] += r.amt; return { label: mkShort(k), full: mkName(k), cur: k === cur, values: vals }; });
  if (ms.length) stackedBars($("#stJunk"), jc, [{ id: "n", name: "Nasi és üdítő", color: cssVar("--s2") }, { id: "a", name: "Alkohol", color: cssVar("--s7") }], { id: "sj", label: "Nasi és alkohol havonta" });
}
function topTable(rows, key, n){
  const m = {}; for (const r of rows) { const k = (r[key] || "").trim(); if (!k) continue; const o = m[fold(k)] = m[fold(k)] || { name: k, n: 0, v: 0 }; o.n++; o.v += r.amt; }
  const e = Object.values(m).sort((x, y) => y.n - x.n || y.v - x.v).slice(0, n);
  return e.length ? `<table class="t compact"><tbody>${e.map(o => `<tr><td><a href="#" data-sq="${esc(o.name)}">${esc(o.name)}</a></td><td class="num muted">${o.n}×</td><td class="num">${fmt(o.v, { noUnit: true })}</td></tr>`).join("")}</tbody></table>` : `<p class="muted small">–</p>`;
}
function scDetail(rows, sc){
  const rs = rows.filter(r => r.sc === sc); if (!rs.length) return "";
  return `<div class="bd" style="padding-top:0"><div class="k" style="margin-bottom:6px">${esc(SUBS[sc].name)}: leggyakoribb tételek</div>${topTable(rs, "name", 8)}</div>`;
}
function extrasUnclassified(){ const out = []; for (const k of monthKeys()) for (const [id, x] of Object.entries(month(k).extras)) if (!x.sc && !x.debt && x.name) out.push([k, id, x]); return out; }
function extrasList(){
  const L = []; for (const k of monthKeys().slice().reverse()) for (const [id, x] of Object.entries(month(k).extras)) if (!x.debt && x.name) L.push([k, id, x]);
  if (!L.length) return "";
  return `<div class="smap">${L.slice(0, 40).map(([k, id, x]) => `<label><span>${esc(x.name)} <span class="muted small">${mkShort(k)}</span></span><select class="inp" data-xsc="${k}|${esc(id)}">${scOptions(extraSc(x), true)}</select></label>`).join("")}</div>`;
}
$("#view-stats").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.sf) { S.sf[t.dataset.sf] = t.value; if (t.dataset.sf === "per" && t.value === "custom") { const [a, b] = statRange(); S.sf.from = a; S.sf.to = b; } if (t.dataset.sf === "g") S.sf.selSc = null; return renderStats(); }
  if (t.dataset.smap) { D().statmap = { ...(D().statmap || {}), [t.dataset.smap]: { sc: t.value, u: nowIso() } }; persist(); return renderStats(); }
  if (t.dataset.xsc) { const [k, id] = t.dataset.xsc.split("|"); const x = month(k).extras[id]; month(k).extras[id] = stamp({ ...x, sc: t.value }); learnSc(x.name, t.value); persist(); return renderStats(); }
});
let sqT;
$("#view-stats").addEventListener("input", e => { if (e.target.dataset.sf === "q") { S.sf.q = e.target.value; clearTimeout(sqT); sqT = setTimeout(() => { renderStats(); const i = document.querySelector('[data-sf="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 300); } });
$("#view-stats").addEventListener("click", async e => {
  const t = e.target;
  const src = t.closest("[data-sfsrc]"); if (src) { S.sf.src[src.dataset.sfsrc] = !S.sf.src[src.dataset.sfsrc]; return renderStats(); }
  if (t.closest("[data-sfns]")) { S.sf.ns = !S.sf.ns; return renderStats(); }
  const so = t.closest("[data-sfsort]"); if (so) { S.sf.sort = so.dataset.sfsort; return renderStats(); }
  const hb = t.closest("[data-hb]");
  if (hb) { const id = hb.dataset.hb; if (id.startsWith("sc:")) S.sf.selSc = S.sf.selSc === id.slice(3) ? null : id.slice(3); else S.sf.open[id] = !S.sf.open[id]; return renderStats(); }
  const sq = t.closest("[data-sq]"); if (sq) { e.preventDefault(); S.sf.q = sq.dataset.sq; renderStats(); return window.scrollTo({ top: 0, behavior: "smooth" }); }
  const tr = t.closest("tr[data-sid]"); if (tr) return openSpendEdit(tr.dataset.sid);
  const a = t.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "stcsv") return statCsv();
  if (a.dataset.act === "rekaimp") return importReka();
  if (a.dataset.act === "aiextras") {
    const L = extrasUnclassified(); if (!L.length) return;
    a.disabled = true; a.textContent = "Besorolás…";
    try {
      const r = await gemClassify(L.map(([, , x]) => x.name));
      let n = 0; for (const o of r || []) { const it = L[o.i]; if (it && SUBS[o.cat]) { const [k, id, x] = it; month(k).extras[id] = stamp({ ...x, sc: o.cat }); n++; } }
      persist(); renderStats(); toast(`${n} eseti tétel besorolva. Nézd át a listát lent.`);
    } catch (x) { toast(x.message); renderStats(); }
  }
});
$("#view-stats").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-hb]")) e.target.click(); });
function statCsv(){
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Hónap","Dátum","Tétel","Bolt","Főcsoport","Kategória","Forrás","Fizetés","Összeg (Ft)"].map(q).join(";")];
  for (const r of statRows()) lines.push([r.k, r.d || "", r.name, r.shop, (SUBS[r.sc] || {}).gname || "", (SUBS[r.sc] || {}).name || "", r.src === "plan" ? "terv" : r.who === "reka" ? "Réka" : "saját", payName(r.pay), Math.round(r.amt)].map(q).join(";"));
  download(`budget-statisztika-${today()}.csv`, "﻿" + lines.join("\r\n"), "text/csv");
}
/* Réka oldalának exportja: { app: "budget-reka", spend: [ {id, d, shop, pay, cur, lines:[{n,a,sc}], note, at, u} ] } */
async function importReka(){
  const inp = $("#fileIn"); inp.value = "";
  const f = await new Promise(res => { inp.onchange = () => res(inp.files[0]); inp.click(); }); if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (x) { return toast("Ez nem érvényes JSON."); }
  const list = Array.isArray(d) ? d : Array.isArray(d.spend) ? d.spend : d.spend ? Object.entries(d.spend).map(([id, s]) => ({ id, ...s })) : null;
  if (!list) return toast("Ebben a fájlban nincs költéslista.");
  D().spend = D().spend || {};
  let add = 0, upd = 0;
  for (const s of list) {
    if (!s || !s.id || !Array.isArray(s.lines)) continue;
    const id = "r-" + String(s.id).replace(/^r-/, ""), old = D().spend[id];
    if (D().deleted["spend/" + id]) continue;
    const rec = { d: s.d || today(), who: "reka", pay: s.pay || "cash", cur: CURS.includes(s.cur) ? s.cur : "HUF", shop: s.shop || "", note: s.note || "", src: "reka", at: s.at || nowIso(),
      lines: s.lines.map(l => ({ n: String(l.n || ""), a: +l.a || 0, sc: SUBS[l.sc] ? l.sc : (guessSc(l.n) || "egyeb.egyeb") })), u: s.u || s.at || nowIso() };
    if (old && (old.u || "") >= rec.u) continue;
    rec.rate = rec.cur === "HUF" ? 1 : (+s.rate || fx(rec.cur)); rec.huf = spendHuf(rec);
    D().spend[id] = rec; old ? upd++ : add++;
  }
  persist(); renderAll(); toast(`Réka költései: ${add} új, ${upd} frissített.`);
}

</script>
