/* Budget · DOS-felület: VGA-betű, 16 színű paletta, dupla keretes ablakok. A Hónap fül egy „asztal”, a többi fül ablakokból áll. */
:root{
  --k0:#000000;--k1:#0000AA;--k2:#00AA00;--k3:#00AAAA;--k4:#AA0000;--k5:#AA00AA;--k6:#AA5500;--k7:#AAAAAA;
  --k8:#555555;--k9:#5555FF;--kA:#55FF55;--kB:#55FFFF;--kC:#FF5555;--kD:#FF55FF;--kE:#FFFF55;--kF:#FFFFFF;
  --fs:20px;--u:calc(var(--fs) + 4px);--lh:calc(var(--fs) * 1.3);
  /* a régi felület változói: kék alapon */
  --bg:var(--k1);--surface:var(--k1);--surface-2:var(--k1);--ink:var(--kF);--muted:var(--kB);--line:var(--kB);--line-2:var(--k9);
  --accent:var(--kE);--accent-ink:var(--k0);--accent-soft:var(--k3);--good:var(--kA);--warn:var(--kE);--bad:var(--kC);--rev:var(--kD);
  --s1:#0000AA;--s2:#AA0000;--s3:#00AA00;--s4:#AA5500;--s5:#AA00AA;--s6:#555555;--s7:#5555FF;--s8:#FF5555;--s9:#888888;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"VGA",monospace;font-size:var(--fs);line-height:var(--lh);color:var(--kF);background-color:var(--k1);
  background-image:radial-gradient(var(--k9) 1px,transparent 1.2px);background-size:4px 4px;
  -webkit-font-smoothing:none;font-smooth:never;min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
button,input,select,textarea{font:inherit;line-height:inherit;color:inherit;border-radius:0}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--kE);outline-offset:0}
a{color:inherit}
main{min-width:0}
b,strong{font-weight:400}
.num{font-variant-numeric:normal}
.muted{color:var(--muted)}
.small{font-size:inherit}
.pos{color:var(--good)}.neg{color:var(--bad)}
code{font:inherit;background:var(--k0);color:var(--kE);padding:0 4px;overflow-wrap:anywhere}
p{margin:6px 0}

/* ---- menüsor, állapotsor ---- */
.menubar{background:var(--k7);color:var(--k0);display:flex;flex-wrap:wrap;font-size:var(--u);line-height:var(--u);position:sticky;top:0;z-index:20}
.menubar .brand{background:var(--k4);color:var(--kF);padding:0 12px;letter-spacing:.1em}
.menubar button{padding:0 10px}
.menubar button .hk{color:var(--k4)}
.menubar button:hover{background:var(--kF)}
.menubar button[aria-selected=true]{background:var(--k2);color:var(--kF)}
.menubar button[aria-selected=true] .hk{color:var(--kE)}
.menubar .right{margin-left:auto;padding:0 12px;color:var(--k1);white-space:nowrap}
.status{background:var(--k7);color:var(--k0);display:flex;flex-wrap:wrap;font-size:var(--u);line-height:var(--u);position:sticky;bottom:0;z-index:20}
.status>span{padding:0 8px;white-space:nowrap}
.status b{color:var(--k4)}
#sbStore b{color:var(--k1)}
#sbSave.ok{color:var(--k2)}#sbSave.err{background:var(--kE);color:var(--k4)}#sbSave.demo{color:var(--k4)}
.status .keys{color:var(--k0)}

/* ---- ablakok ---- */
.win,.card{position:relative;border:4px double var(--kF);box-shadow:8px 8px 0 rgba(0,0,0,.55);min-width:0;padding:calc(var(--u) * .7) 12px 12px}
.win>.wt,.card>.hd h2{position:absolute;top:calc(var(--u) * -.62);left:50%;transform:translateX(-50%);padding:0 8px;white-space:nowrap;font-size:var(--u);line-height:var(--u);font-weight:400;margin:0;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.w-cyan,.card{background:var(--k3);color:var(--k0);
  --ink:#000;--muted:#0000AA;--line:#000;--line-2:#008080;--surface:#00AAAA;--surface-2:#55FFFF;--accent:#0000AA;--accent-ink:#fff;--accent-soft:#55FFFF;--good:#005500;--warn:#AA5500;--bad:#AA0000;--rev:#AA00AA}
.w-cyan>.wt,.card>.hd h2{background:var(--k3);color:var(--kF)}
.w-blue{background:var(--k1);border-color:var(--kB);color:var(--kF)}.w-blue>.wt{background:var(--k1);color:var(--kF)}
.w-gray{background:var(--k7);color:var(--k0);--ink:#000;--muted:#0000AA;--line:#000;--surface:#AAAAAA;--surface-2:#C8C8C8;--good:#005500;--bad:#AA0000}
.w-gray>.wt{background:var(--k7);color:var(--k0)}
.w-red{background:var(--k4);color:var(--kF);--muted:#FFFF55;--good:#55FF55;--bad:#FFFF55}.w-red>.wt{background:var(--k4);color:var(--kF)}

/* ---- gombok, mezők ---- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--k2);color:var(--k0);padding:0 10px;box-shadow:4px 3px 0 var(--k0);margin:4px 8px 6px 0;white-space:nowrap;min-height:var(--lh)}
.btn:hover{background:var(--kA)}
.btn.primary{background:var(--kA)}
.btn.ghost{background:var(--k7)}
.btn.danger{background:var(--kC);color:var(--k0)}
.btn.sm{padding:0 8px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{background:var(--k8);color:var(--k7);box-shadow:none;cursor:default}
.icon-btn{color:var(--muted);padding:0 6px;min-width:var(--lh)}
.icon-btn:hover{background:var(--k0);color:var(--kE)}
.inp,input[type=text],input[type=search],input[type=date],input[inputmode],select{background:var(--k0);color:var(--kF);border:2px solid var(--kF);padding:2px 6px;width:100%;min-width:0;line-height:var(--lh)}
.inp:focus,input:focus,select:focus{outline:0;border-color:var(--kE)}
.inp.num{text-align:right}
select option,select optgroup{background:var(--k0);color:var(--kF)}
input::placeholder{color:var(--k8)}
input[type=checkbox]{width:calc(var(--fs) * .9);height:calc(var(--fs) * .9);accent-color:var(--k1);margin:0}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addline{display:flex;gap:8px;align-items:center}.addline .inp{flex:1}.addline .btn{margin:0 6px 0 0}
.actions,.acts{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center}
.acts .muted{margin-left:4px}
.toggle,.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tg{margin-right:14px}
.seg{display:inline-flex;border:2px solid currentColor;flex-wrap:wrap}
.seg button{padding:0 10px}
.seg button[aria-pressed=true]{background:var(--k0);color:var(--kE)}
.chip{display:inline-block;padding:0 6px;background:var(--k1);color:var(--kF);white-space:nowrap}
.chip.rev{background:var(--k5)}.chip.done{background:var(--k2);color:var(--k0)}.chip.over{background:var(--k4)}
.chipbtn{border:2px solid currentColor;padding:0 8px}
.chipbtn[aria-pressed=true]{background:var(--k0);color:var(--kE);border-color:var(--k0)}
.k{color:var(--muted)}
.empty{color:var(--muted);padding:6px 0}
.banner{background:var(--k3);color:var(--k0);border:2px solid var(--kF);padding:4px 10px;margin:0 0 18px}
.tag{background:var(--k7);color:var(--k0);padding:0 6px}.tag.now{background:var(--kE)}
.perbtn{color:var(--kB)}.perbtn:hover{background:var(--k0);color:var(--kE)}
.spacer{flex:1}

/* ---- Hónap: asztal ---- */
#view-month{padding:calc(var(--u) + 8px) 14px 10px}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);gap:calc(var(--u) + 10px) 16px;align-items:start}
.desk.one{grid-template-columns:minmax(0,760px);justify-content:center}
.desk .col{display:grid;gap:calc(var(--u) + 10px);min-width:0}
.big{font-size:calc(var(--fs) * 2.1);line-height:1.15;color:var(--kE);margin:2px 0;white-space:nowrap}
.w-cyan .big{color:var(--k1)}.w-cyan .big.neg{color:var(--k4)}
.sub{color:var(--k1)}.sub2{margin-bottom:8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;margin:8px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;white-space:nowrap}
.kv dd.full,.kv dd.bar{grid-column:1/-1;text-align:right}
.kv dd.full{white-space:normal}
.kv .sep{grid-column:1/-1;border-top:2px solid var(--k0);margin:6px 0}
.w-red .kv .sep{border-color:var(--kF)}
.kv .bar{white-space:nowrap;overflow:hidden;color:var(--k1)}
.kv .bar b{color:var(--k0)}
.kv dd .btn{margin:2px 0 4px 8px}
.balrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.balrow span{white-space:nowrap}
.balrow input{text-align:right}
.ov .hint{color:var(--k1)}
.rates .rt{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:0 10px;align-items:baseline}
.rates .rt .v{text-align:right}
.rates .rt .h{color:var(--k1);text-align:right}
.chg{text-align:right;white-space:nowrap}.chg.up{color:var(--k2)}.chg.dn{color:var(--k4)}
.mnav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:6px}
.mnav .btn{margin:0 4px 4px 0}
.thd,.pr{display:grid;grid-template-columns:3.2ch minmax(0,1fr) 4ch 9ch 9ch;gap:0 10px;align-items:baseline}
.thd{color:var(--kB);border-bottom:2px solid var(--kB);padding:0 6px 2px;margin-bottom:6px}
.thd span:nth-child(n+3),.pr>span:nth-child(n+3){text-align:right}
.grp{display:flex;gap:10px;padding:0 6px;color:var(--kF);margin-top:10px;white-space:nowrap;overflow:hidden}
.grp .s{margin-left:auto}
.pr{padding:0 6px;position:relative;cursor:pointer;white-space:nowrap}
.pr .n{overflow:hidden;text-overflow:ellipsis}
.pr .n small{font-size:inherit;color:var(--kB)}
.pr .n .md{display:none}
.pr .ck,.due .ck{color:var(--k7);text-align:left}
.pr .ck:hover,.due .ck:hover{color:var(--kE)}
.pr.ok .ck{color:var(--kA)}
.pr.part .ck,.pr.part .a{color:var(--kE)}
.pr.inc .ck{color:var(--kD)}
.pr.inc.ok .ck{color:var(--kA)}
.pr .d{color:var(--kB)}
.pr .p{color:var(--k7)}
.pr.ok .a{color:var(--kA)}
.pr.zero{color:var(--k7)}
.pr:hover{background:var(--k9)}
.pr.sel{background:var(--k0)}
.pr.sel::before{content:"►";position:absolute;left:-14px;color:var(--kE)}
i.rv,i.ov{font-style:normal;background:var(--k5);color:var(--kF);padding:0 3px;margin-left:6px}
i.ov{background:var(--k4)}
.addrow{padding:2px 6px}
.plan .hint{color:var(--kB);margin-top:10px}
.due .row{display:grid;grid-template-columns:3.2ch 4ch minmax(0,1fr) auto;align-items:start;gap:0 10px;white-space:nowrap;cursor:pointer;padding:0 2px}
.due .row:hover{background:var(--k0)}
.due .row .n{overflow:hidden;text-overflow:ellipsis}
.due .row .n small{font-size:inherit;color:var(--kE)}
.due .row .d{color:var(--kF)}
.due .row.soon .d,.due .row.soon .n{color:var(--kE)}
.due .row.late .d,.due .row.late .n{color:var(--kE);text-decoration:underline}
.due .ck{color:var(--kF)}
.dc{display:block;width:100%;text-align:left;padding:2px 4px;margin-bottom:8px}
.dc:hover{background:var(--kB)}
.dc .h{display:flex;justify-content:space-between;gap:10px}
.dc .h b{color:var(--k1)}
.dc small{font-size:inherit;color:var(--k1);display:block}
.pend{font-style:normal;color:var(--k4);margin-left:8px}
.meter{display:block;background:var(--k0);color:var(--kA);padding:0 4px;white-space:nowrap;overflow:hidden;margin:2px 0}
.meter.warn{color:var(--kE)}.meter.full{color:var(--kC)}
.stripwin{margin:calc(var(--u) + 6px) 14px 18px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(calc(var(--fs) * 2.3),1fr);overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--k1) var(--k7)}
.day{border-right:2px solid var(--k8);min-height:calc(var(--lh) * 3.5);padding:0 2px;text-align:center}
.day .dn{display:block;background:var(--k1);color:var(--kF)}
.day.we .dn{background:var(--k8)}
.day.today .dn{background:var(--kE);color:var(--k0)}
.day.past .dn{opacity:.7}
.day i{display:block;font-style:normal}
.day i.ok{color:var(--k2)}.day i.no{color:var(--k4)}

/* ---- többi fül ---- */
.page{padding:18px 14px 20px}
.mhead{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:calc(var(--u) + 10px)}
.mhead h1{margin:0;font-size:calc(var(--fs) * 1.6);line-height:1.2;font-weight:400;color:var(--kE)}
.mhead .per{color:var(--kB)}
.mhead .btn{margin:0}
.grid,.sgrid,.agrid,.setg{display:grid;gap:calc(var(--u) + 14px) 16px;align-items:start}
.sgrid,.agrid,.setg{grid-template-columns:repeat(2,minmax(0,1fr))}
.sgrid .wide{grid-column:1/-1}
.sgrid+.card,.card+.sgrid,#stList{margin-top:calc(var(--u) + 14px)}
.card>.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:0;padding:0 0 4px}
.card>.hd:not(:has(>:not(h2))){padding:0}
.card>.hd .btn{margin:0 6px 4px 0}
.card>.bd{padding:0}
.setg .bd{display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:calc(var(--u) + 14px)}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--k3);color:var(--k0);border:4px double var(--kF);box-shadow:6px 6px 0 rgba(0,0,0,.55);padding:6px 10px;min-width:0;--muted:#0000AA;--good:#005500;--bad:#AA0000}
.kpi .k{color:var(--k1)}
.kpi .v{font-size:calc(var(--fs) * 1.4);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{color:var(--k1)}
.tblwrap{overflow:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{padding:1px 10px;white-space:nowrap;text-align:right}
table.t th{background:var(--k1);color:var(--kF);font-weight:400;position:sticky;top:0;z-index:2}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;z-index:1}
table.t td:first-child{background:var(--k3)}
table.t th:first-child{z-index:3}
table.t td{border-bottom:1px solid #008080;color:var(--k0)}
table.t tbody tr:hover td{background:var(--k7)}
table.t tr.cur td{background:var(--kB)}
table.t tr.sec td{background:var(--k1);color:var(--kF)}
table.t td.ed{cursor:cell}
table.t td.ed:hover{outline:2px solid var(--k1);outline-offset:-2px}
table.t td.ed input{width:7em;text-align:right;padding:0 4px}
table.t td.pl{color:var(--k1)}
table.t tfoot td,table.t tfoot td:first-child{background:var(--k1);color:var(--kF);border:0}
table.t th.tx,table.t td.tx{text-align:left;white-space:normal;min-width:6em}
table.t td input.inp{padding:0 4px}
tr.clk{cursor:pointer}
table.t a{color:var(--k1)}
/* diagramok */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:#008080;stroke-width:1}
.chart .ax{fill:var(--k1);font:17px "VGA",monospace}
.chart .hit{fill:transparent;cursor:crosshair}
.chart rect[rx],.chart clipPath rect{rx:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.legend i{display:inline-block;width:.8em;height:.8em;margin-right:6px}
.lg{display:inline-flex;align-items:center;border:2px solid var(--k0);padding:0 6px}
.lg[aria-pressed=false]{opacity:.5;text-decoration:line-through}
.lg .muted{margin-left:6px}
.tip{position:absolute;pointer-events:none;background:var(--k0);color:var(--kF);border:2px solid var(--kF);padding:4px 8px;z-index:5;min-width:12em;opacity:0}
.tip.on{opacity:1}
.tip .h{color:var(--kE)}
.tip .r{display:flex;gap:10px;justify-content:space-between}
.tip .r i{display:inline-block;width:.7em;height:.7em;margin-right:6px}
.tip .r.tot{border-top:2px solid var(--kF);margin-top:2px}
.hb{display:grid;gap:0}
.hbr{display:grid;grid-template-columns:minmax(6em,38%) minmax(0,1fr) 8ch 4ch;gap:8px;align-items:center;padding:0 4px}
.hbr.clk{cursor:pointer}.hbr.clk:hover{background:var(--k7)}
.hbr.sub .hl{padding-left:1.4em}
.hl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{height:calc(var(--fs) * .7);background:#008080}
.hbar i{display:block;height:100%;background:var(--k1);min-width:2px}
.hbr.sub .hbar i{background:var(--k9)}
.hv,.hp{text-align:right}
.caret{display:inline-block;width:1.2em}
.sfbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:calc(var(--u) + 14px)}
.sfbar .inp{width:auto}
.sfbar .grow{flex:1 1 14em}
.sfbar .chipbtn{color:var(--kF)}
.sfbar .chipbtn[aria-pressed=true]{background:var(--kF);color:var(--k1);border-color:var(--kF)}
.smap{display:grid;gap:4px;max-height:60vh;overflow:auto}
.smap label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,14em);gap:10px;align-items:center}
.smap label.off{opacity:.6}
/* vagyon */
.acct .lines{display:grid;grid-template-columns:3.5em minmax(0,1fr) minmax(0,1fr);gap:4px 10px;align-items:center}
.acct .cur{color:var(--k1)}
.acct .eq{text-align:right;color:var(--k1)}
.acct .sum{display:flex;justify-content:space-between;border-top:2px solid var(--k0);margin-top:8px;padding-top:4px}
.compo{display:flex;height:calc(var(--fs) * .8);gap:2px;margin:6px 0 10px;background:var(--k0);padding:2px}
.compo i{display:block;height:100%;min-width:3px}
.totals{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px}
.totals .num{text-align:right}
.totals .big{font-size:inherit;color:var(--k1);border-top:2px solid var(--k0);padding-top:4px;margin:4px 0 0;white-space:normal}
details.dcard>summary{list-style:none;display:grid;grid-template-columns:2ch minmax(0,1fr) auto auto;gap:10px;align-items:center;cursor:pointer;padding:2px 0}
details.dcard>summary::-webkit-details-marker{display:none}
details.dcard .nm .sub{display:block;color:var(--k1)}
details.dcard .amt{text-align:right;display:grid}
.dbody{display:grid;gap:10px;padding-top:8px}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.dgrid .v{padding:2px 0}
.pendbox{border:2px solid var(--k0);padding:6px 8px;background:var(--surface-2)}
.prow{display:grid;grid-template-columns:7ch minmax(0,1fr) auto;gap:8px}
.prow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tételek */
.irow{display:grid;grid-template-columns:minmax(8em,1.6fr) 4ch 8em 11em 8em 2ch 2ch 3ch 3ch;gap:8px;align-items:center;padding:3px 0;border-top:2px solid #008080}
.irow.ih{color:var(--k1);border-top:0}
.irow.off{opacity:.55}
.irow .mpick{margin:0;overflow:hidden;text-overflow:ellipsis;justify-content:flex-start}
.monpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(6em,1fr));gap:6px}
.monpick .chipbtn{text-align:center}
/* beállítás, indulás */
.setup{max-width:780px;margin:calc(var(--u) * 2) auto;padding:0 14px}
.setup .card{padding:calc(var(--u) * .8) 16px 16px}
.setup h2{position:absolute;top:calc(var(--u) * -.62);left:50%;transform:translateX(-50%);background:var(--k3);color:var(--kF);padding:0 8px;margin:0;font-size:var(--u);line-height:var(--u);font-weight:400;white-space:nowrap}
.setup p{color:var(--k1)}
.choices{display:grid;gap:10px}
.choice{display:block;text-align:left;padding:6px 10px;border:2px solid var(--k0);background:var(--kB)}
.choice:hover{background:var(--kF)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.choice b{display:block;color:var(--k1)}
.choice span{color:var(--k0)}

/* ---- ablakok: szerkesztő (szürke), párbeszéd (piros), üzenet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--k7);color:var(--k0);border-left:4px double var(--kF);box-shadow:-8px 0 0 rgba(0,0,0,.55);display:none;flex-direction:column;
  --ink:#000;--muted:#0000AA;--line:#000;--line-2:#555;--surface:#AAAAAA;--surface-2:#C8C8C8;--accent:#0000AA;--good:#005500;--bad:#AA0000;--warn:#AA5500}
.drawer.on{display:flex}
.drawer .dh{display:flex;align-items:center;gap:10px;background:var(--k1);color:var(--kF);padding:0 0 0 10px;font-size:var(--u);line-height:calc(var(--u) * 1.3)}
.drawer .dh h3{margin:0;font-size:inherit;font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dh .icon-btn{color:var(--kF);background:var(--k4);padding:0 12px}
.drawer .db{padding:12px 14px;overflow:auto;display:grid;gap:12px;align-content:start;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.drawer .kpi{box-shadow:none}
.drawer .diffline b{color:var(--k1)}
.drawer .seg button[aria-pressed=true]{background:var(--k1);color:var(--kF)}
.dlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:12px;overflow:auto}
.dlg .win{width:min(760px,96vw);padding:calc(var(--u) * .8) 16px 14px}
.dlg .kv dt{color:var(--kE)}
.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:calc(var(--u) * 2);background:var(--kE);color:var(--k0);border:2px solid var(--k0);padding:2px 12px;z-index:90;max-width:calc(100% - 24px);display:none;gap:12px;align-items:center;box-shadow:6px 6px 0 rgba(0,0,0,.55)}
.toast.on{display:flex}
.toast button{background:var(--k1);color:var(--kF);padding:0 8px}

/* ---- kisebb képernyő ---- */
@media (max-width:1280px){
  .desk{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .desk>.col.mid{grid-column:1/-1;order:-1}
  .kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .sgrid,.agrid,.setg{grid-template-columns:minmax(0,1fr)}
  .irow{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:4px}
  .irow>:first-child{grid-column:1/-1}
  .irow.ih{display:none}
}
@media (max-width:760px){
  .desk{grid-template-columns:minmax(0,1fr)}
  #view-month{padding:calc(var(--u) + 6px) 8px 8px}
  .page{padding:14px 8px}
  .stripwin{margin:calc(var(--u) + 6px) 8px 14px}
  .win,.card{padding-left:8px;padding-right:8px}
  .thd,.pr{grid-template-columns:3.2ch minmax(0,1fr) 7ch 8ch;gap:0 6px}
  .thd .dcol,.pr>.d{display:none}
  .pr{white-space:normal;align-items:start}
  .pr .n{overflow:visible;overflow-wrap:anywhere}
  .pr .n .md{display:inline}
  .pr>span:nth-child(n+3){white-space:nowrap}
  .big{font-size:calc(var(--fs) * 1.8)}
  .menubar .right{margin-left:0;width:100%;background:var(--k1);color:var(--kB);white-space:normal}
  .status .keys{display:none}
  .drawer{top:auto;left:0;width:100%;max-height:90vh;border-left:0;border-top:4px double var(--kF)}
  .two,.dgrid{grid-template-columns:minmax(0,1fr)}
  .hbr{grid-template-columns:minmax(0,1fr) 8ch 4ch;row-gap:2px}.hbr .hbar{grid-column:1/-1;grid-row:2}
  .smap label{grid-template-columns:minmax(0,1fr)}
  .rates .rt{grid-template-columns:auto minmax(0,1fr) auto auto}
  .rates .rt>:nth-child(5n){display:none}
  .due .row{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<nav class="menubar" id="tabs" role="tablist" hidden>
  <span class="brand">BUDGET</span>

<script>
"use strict";
/* ================= config ================= */
const APP_VERSION = "2.0 lite · 2026.11.18. 14:58";   // a build.py írja be a build idejét
const CLIENT_ID_DEFAULT = "9dc570fe-f641-46ed-93be-5414be4ae0c9";            // Microsoft app (client) ID – a Beállításokban is megadható
const GRAPH_SCOPES = ["Files.ReadWrite"];
const FILE = "budget.json";

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = p => (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NBSP = " ";
function fmt(n, opt){
  if (n == null || n === "" || isNaN(n)) return "–";
  const v = Math.round(Number(n));
  const s = Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (v < 0 ? "−" : (opt && opt.sign && v > 0 ? "+" : "")) + s + (opt && opt.noUnit ? "" : NBSP + "Ft");
}
function fmtN(n, d){ if (n == null || isNaN(n)) return "–"; return Number(n).toLocaleString("hu-HU", { maximumFractionDigits: d ?? 2 }); }
function parseAmt(s){
  if (s == null) return null;
  s = String(s).replace(/\s| |Ft/gi, "").replace(/−/g, "-").replace(",", ".");
  if (s === "") return null;
  if (!/^[-+]?[\d.]+([-+][\d.]+)*$/.test(s)) return NaN;
  return Math.round((s.match(/[-+]?[\d.]+/g) || []).reduce((a, x) => a + parseFloat(x), 0) * 1e8) / 1e8;   // 8 tizedes (kripto)
}
const HU_MONTHS = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mkParse = k => { const [y, m] = k.split("-").map(Number); return { y, m }; };
const mkOf = (y, m) => { while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const mkAdd = (k, n) => { const { y, m } = mkParse(k); return mkOf(y, m + n); };
const mkName = k => { const { y, m } = mkParse(k); return `${cap(HU_MONTHS[m-1])} ${y}`; };
const mkShort = k => { const { y, m } = mkParse(k); return `${cap(HU_MONTHS[m-1]).slice(0,3)} ${String(y).slice(2)}`; };
/* a partner neve (beállítható); a belső azonosítók (rekaPct, who: "reka") változatlanok */
function partner(){ const n = S.data && S.data.settings && S.data.settings.partnerName; return String(n || "").trim() || "Partner"; }
/* magyar toldalék tetszőleges névhez: hangrend az utolsó nem semleges magánhangzó szerint, a végső a/e megnyúlik */
function huStem(w){ return w.replace(/a$/, "á").replace(/e$/, "é").replace(/A$/, "Á").replace(/E$/, "É"); }
function huBack(w){ for (const ch of w.toLowerCase().split("").reverse()) { if ("aáoóuú".includes(ch)) return true; if ("eöőüű".includes(ch)) return false; } return false; }
const pNak = () => { const n = partner(); return huStem(n) + (huBack(n) ? "nak" : "nek"); };   // Partnernek
const pE = () => huStem(partner()) + "é";                                                    // Partneré
function startDay(){ return (S.data && S.data.settings && S.data.settings.startDay) || 10; }
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dparse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
/* egy hónap (időszak) kezdőnapja: egyedi beállítás (pl. korábban jött a fizetés), különben a beállított nap */
function periodStartStr(k){
  const o = S.data && S.data.periods && S.data.periods[k];
  if (o && /^\d{4}-\d\d-\d\d$/.test(o.s || "")) return o.s;
  const { y, m } = mkParse(k); return dstr(new Date(y, m - 1, startDay()));
}
function mkOfDateStr(ds){
  const [y, m, d] = String(ds).split("-").map(Number);
  let k = d >= startDay() ? mkOf(y, m) : mkOf(y, m - 1);
  for (let i = 0; i < 2; i++) {
    if (ds < periodStartStr(k)) k = mkAdd(k, -1);
    else if (ds >= periodStartStr(mkAdd(k, 1))) k = mkAdd(k, 1);
    else break;
  }
  return k;
}
function currentMk(d){ return mkOfDateStr(dstr(d || new Date())); }
function period(k){
  const start = dparse(periodStartStr(k)), end = dparse(periodStartStr(mkAdd(k, 1))); end.setDate(end.getDate() - 1);
  let mondays = 0; for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) if (d.getDay() === 1) mondays++;
  return { start, end, mondays };
}
const dshort = d => `${pad(d.getMonth()+1)}.${pad(d.getDate())}.`;

/* ================= state ================= */
const S = { data: null, mk: null, tab: "month", mode: null, showZero: false, yearMode: "a", matrix: "p", open: {} };
const LS = {
  get(k, d){ try { const v = localStorage.getItem("budget." + k); return v == null ? d : JSON.parse(v); } catch(x) { return d; } },
  set(k, v){ try { localStorage.setItem("budget." + k, JSON.stringify(v)); } catch(x) {} }
};

/* ================= data access ================= */
const D = () => S.data;
const items = () => D().items.slice().sort((a,b) => (a.o ?? 0) - (b.o ?? 0));
const itemById = id => D().items.find(i => i.id === id);
const catById = id => D().cats.find(c => c.id === id);
const month = k => D().months[k];
const monthKeys = () => Object.keys(D().months).sort();
const isIncomeCat = cid => { const c = catById(cid); return c && c.kind === "income"; };
function stamp(o){ o.u = nowIso(); return o; }

/* ================= calculation ================= */
function monthLines(k){
  const mo = month(k); if (!mo) return [];
  const out = [];
  for (const it of items()) {
    const ln = mo.lines[it.id];
    if (!ln && it.off) continue;
    const l = ln || { p: 0 };
    out.push({ kind: "item", id: it.id, name: it.name, cat: it.cat, due: it.due, note: it.note, carry: !!it.carry,
      p: +l.p || 0, a: l.a == null ? null : +l.a, rev: !!l.rev, done: !!l.done, has: !!ln, off: !!it.off, lnote: l.note });
  }
  for (const [id, e] of Object.entries(mo.extras || {})) {
    out.push({ kind: "extra", id, name: e.name || "Eseti tétel", cat: e.cat || "eseti", due: e.due, p: +e.p || 0, a: e.a == null ? null : +e.a, rev: !!e.rev, done: !!e.done, has: true, lnote: e.note });
  }
  return out;
}
/* A kiadás várható értéke („módosított terv”): lezárt sornál a tény; nyitott sornál a terv,
   kivéve, ha a tény már meghaladta – mert nyitott sorra még jöhet költés. */
function expA(l){ return l.done ? (l.a != null ? l.a : l.p) : Math.max(l.p || 0, l.a || 0); }
function incA(l){ return l.a != null ? l.a : 0; }   // bevételnél a tény csak a ténylegesen beírt összeg
function remaining(l){ return l.done ? 0 : Math.max(l.p - (l.a || 0), 0); }
function rekaOf(bal){
  const st = D().settings, pct = (st.rekaPct ?? 52) / 100, r = st.rekaRound || 5000;
  if (!(bal > 0)) return 0;
  const x = bal * pct / r;
  return (st.rekaMode === "round" ? Math.round(x) : Math.ceil(x - 1e-9)) * r;
}
function calc(k){
  const mo = month(k); if (!mo) return null;
  const L = monthLines(k);
  const r = { k, lines: L, inc: { p: 0, a: 0 }, exp: { p: 0, a: 0 }, cats: {}, revOpen: 0, revOpenN: 0, openN: 0 };
  for (const c of D().cats) r.cats[c.id] = { p: 0, a: 0, act: 0 };
  for (const l of L) {
    const inc = isIncomeCat(l.cat);
    const cc = r.cats[l.cat] || (r.cats[l.cat] = { p: 0, a: 0, act: 0 });
    if (inc) { r.inc.p += l.p; r.inc.a += incA(l); cc.p += l.p; cc.a += incA(l); cc.act += l.a || 0; }
    else {
      r.exp.p += l.p; r.exp.a += expA(l); cc.p += l.p; cc.a += expA(l); cc.act += l.a || 0;
      const rem = remaining(l);
      if (rem > 0) { r.openN++; if (l.rev) { r.revOpen += rem; r.revOpenN++; } }
    }
  }
  r.bal = { p: r.inc.p - r.exp.p, a: r.inc.a - r.exp.a };
  r.reka = rekaOf(r.bal.p);
  r.rekaPaid = mo.meta && mo.meta.rekaPaid != null ? +mo.meta.rekaPaid : null;
  r.revolut = mo.meta && mo.meta.revolut != null && mo.meta.revolut !== "" ? +mo.meta.revolut : null;
  r.spendRev = spendRevAfter(k);
  r.incRev = incomeRevAfter(k);
  r.keret = r.revolut == null ? null : r.revolut - r.revOpen - r.spendRev.sum + r.incRev.sum;
  return r;
}

/* ================= month generation ================= */
/* tétel szabálya: "" havi (öröklődik), week hétfőnként, year évente a kijelölt hónapokban, dates konkrét hónapokban (pl. 2026-11) */
const ruleKind = it => it.rule ? "week" : it.dates ? "dates" : it.months ? "year" : "";
/* a tétel terve egy hónapra a szabály szerint; havi szabálynál null (öröklődik / alapterv) */
function planOf(it, k){
  const r = ruleKind(it);
  if (r === "week") return period(k).mondays * (it.rule.perMonday || 0);
  if (r === "year") return it.months.includes(mkParse(k).m) ? (it.plan || 0) : 0;
  if (r === "dates") return it.dates.includes(k) ? (it.plan || 0) : 0;
  return null;
}
/* a kijelölt hónapos tételek tervének igazítása az aktuális és a már létrehozott jövőbeli hónapokban
   (lezárt hónaphoz és rögzített összegű sorhoz nem nyúl); visszaadja az érintett hónapok számát */
function syncItemPlan(it){
  if (!["year","dates"].includes(ruleKind(it)) || it.off) return 0;
  let n = 0;
  for (const k of monthKeys().filter(k => k >= currentMk())) {
    const mo = month(k); if (mo.meta.closed) continue;
    const ln = mo.lines[it.id]; if (ln && (ln.a != null || ln.done)) continue;
    const p = planOf(it, k);
    if (ln && (+ln.p || 0) === p) continue;
    if (!ln && !p) continue;
    mo.lines[it.id] = stamp({ ...(ln || {}), p, ...(!ln && it.rev ? { rev: true } : {}) }); delete D().deleted[`months/${k}/lines/${it.id}`]; n++;
  }
  return n;
}
function newMonthFrom(k){
  const prevK = monthKeys().filter(x => x < k).pop();
  const prev = prevK ? month(prevK) : null;
  const { m } = mkParse(k), per = period(k);
  const mo = { lines: {}, extras: {}, meta: stamp({}) };
  for (const it of items()) {
    if (it.off) continue;
    const pl = prev && prev.lines[it.id];
    let p;
    if (it.carry) p = 0;
    else if (it.rule && it.rule.perMonday) p = per.mondays * it.rule.perMonday;
    else if (it.dates) p = it.dates.includes(k) ? (it.plan || (pl && pl.p) || 0) : 0;
    else if (it.months) p = it.months.includes(m) ? (it.plan || (pl && pl.p) || 0) : 0;
    else p = pl ? (+pl.p || 0) : (it.plan || 0);
    const ln = stamp({ p });
    if (pl ? pl.rev : it.rev) ln.rev = true;
    mo.lines[it.id] = ln;
  }
  return mo;
}

/* ================= merge (record level, newest "u" wins) ================= */
function newer(a, b){ if (!a) return b; if (!b) return a; return (b.u || "") > (a.u || "") ? b : a; }
function mergeObj(A, B, path, del){
  const out = {};
  for (const k of new Set([...Object.keys(A || {}), ...Object.keys(B || {})])) {
    const v = newer((A || {})[k], (B || {})[k]);
    const t = del[path + "/" + k];
    if (t && t >= (v.u || "")) continue;
    out[k] = v;
  }
  return out;
}
function mergeArr(A, B, path, del){
  const m = mergeObj(Object.fromEntries((A||[]).map(x => [x.id, x])), Object.fromEntries((B||[]).map(x => [x.id, x])), path, del);
  const order = [...(A||[]).map(x => x.id), ...(B||[]).map(x => x.id)];
  return [...new Set(order)].filter(id => m[id]).map(id => m[id]);
}
function mergeData(A, B){
  if (!A) return B; if (!B) return A;
  const del = { ...(A.deleted || {}) };
  for (const [k, t] of Object.entries(B.deleted || {})) if (!del[k] || del[k] < t) del[k] = t;
  const out = { ...A, deleted: del };
  out.settings = newer(A.settings, B.settings);
  out.cats = mergeArr(A.cats, B.cats, "cats", del);
  out.items = mergeArr(A.items, B.items, "items", del);
  out.months = {};
  for (const k of new Set([...Object.keys(A.months || {}), ...Object.keys(B.months || {})])) {
    const a = (A.months || {})[k], b = (B.months || {})[k];
    if (!a || !b) { out.months[k] = a || b; continue; }
    out.months[k] = { meta: newer(a.meta, b.meta), lines: mergeObj(a.lines, b.lines, `months/${k}/lines`, del), extras: mergeObj(a.extras, b.extras, `months/${k}/extras`, del) };
  }
  const aa = A.assets || {}, bb = B.assets || {};
  out.assets = {};
  for (const g of ["accounts","stocks","crypto","debts","snaps"]) out.assets[g] = mergeObj(aa[g], bb[g], "assets/" + g, del);
  out.assets.px = newer(aa.px, bb.px);
  out.assets.ep = newer(aa.ep, bb.ep);
  for (const g of ["spend","learn","statmap","periods"]) out[g] = mergeObj(A[g], B[g], g, del);
  return out;
}
function normalize(d){
  d.settings = { rekaPct: 52, rekaRound: 5000, rekaMode: "ceil", startDay: 10, folder: "Budget", partnerName: "Partner", ...(d.settings || {}) };
  d.cats = d.cats || []; d.items = d.items || []; d.months = d.months || {}; d.deleted = d.deleted || {};
  d.assets = d.assets || {}; d.spend = d.spend || {}; d.learn = d.learn || {}; d.statmap = d.statmap || {}; d.periods = d.periods || {};
  for (const g of ["accounts","stocks","crypto","debts","snaps"]) d.assets[g] = d.assets[g] || {};
  for (const mo of Object.values(d.months)) { mo.lines = mo.lines || {}; mo.extras = mo.extras || {}; mo.meta = mo.meta || {}; }
  for (const [id, dt] of Object.entries(d.assets.debts)) if (!dt.id) dt.id = id;
  // v1.1: a „HUF eseti” sor megszűnik (eseti kiadás váltja ki)
  const he = d.items.find(i => i.id === "huf-eseti"); if (he && !he.off && !(d.settings.mig || []).includes("hufeseti")) { he.off = true; he.u = nowIso(); d.settings.mig = [...(d.settings.mig || []), "hufeseti"]; }
  return d;
}
function payload(){ return JSON.stringify({ ...D(), app: "budget", version: 1, savedAt: nowIso() }, null, 1); }

/* ================= storage: common ================= */
const ST = { store: null, ver: null, t: null, saving: false, again: false, dirty: false, lastCheck: 0 };
function persist(){
  ST.dirty = true;
  if (!ST.store) return status("nem ment", "demo");
  status("Mentés…"); clearTimeout(ST.t); ST.t = setTimeout(flush, 500);
}
async function flush(){
  if (!ST.store) return;
  if (ST.saving) { ST.again = true; return; }
  ST.saving = true;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const cur = await ST.store.head();
      if (cur && ST.ver && cur !== ST.ver) {
        const r = await ST.store.read();
        if (r) { S.data = normalize(mergeData(S.data, r.data)); toast("Máshol is módosult az adat, összefésültem."); renderAll(); }
      }
      await ST.store.backup().catch(() => {});
      try { ST.ver = await ST.store.write(payload(), cur); break; }
      catch (x) { if (x.conflict && attempt < 2) { ST.ver = "?"; continue; } throw x; }
    }
    ST.dirty = false;
    status("Mentve " + new Date().toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit" }), "ok");
  } catch (x) {
    console.error(x);
    status(x.auth ? "Újra be kell lépni" : "Mentési hiba: " + (x.message || x.name), "err");
    if (x.auth) toast("A OneDrive-bejelentkezés lejárt.", () => msLogin(), "Belépés");
  } finally { ST.saving = false; if (ST.again) { ST.again = false; flush(); } }
}
async function checkRemote(force){
  if (!ST.store || ST.saving || ST.dirty) return;
  if (!force && Date.now() - ST.lastCheck < 15000) return;
  ST.lastCheck = Date.now();
  try {
    const cur = await ST.store.head();
    if (cur && ST.ver && cur !== ST.ver) {
      const r = await ST.store.read(); if (!r) return;
      S.data = normalize(mergeData(S.data, r.data)); ST.ver = r.ver; renderAll();
      toast("Frissítve a legújabb mentésből.");
    }
  } catch (x) { console.warn("check", x); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkRemote(true); });
window.addEventListener("focus", () => checkRemote());
setInterval(() => { if (document.visibilityState === "visible") checkRemote(); }, 60000);
window.addEventListener("beforeunload", e => { if (ST.dirty && ST.store) { flush(); e.preventDefault(); e.returnValue = ""; } });

/* ================= storage: local folder (File System Access) ================= */
function idb(){ return new Promise((res, rej) => { const q = indexedDB.open("budget-local", 1); q.onupgradeneeded = () => q.result.createObjectStore("kv"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kvGet(k){ try { const db = await idb(); return await new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch(x) { return null; } }
async function kvSet(k, v){ try { const db = await idb(); await new Promise(r => { const t = db.transaction("kv","readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = r; t.onerror = r; }); } catch(x) {} }
function LocalStore(dir){
  const fileH = async create => dir.getFileHandle(FILE, create ? { create: true } : undefined);
  return {
    kind: "local", label: dir.name,

function GraphStore(folder){
  const seg = p => p.split("/").filter(Boolean).map(encodeURIComponent).join("/");
  const base = `https://graph.microsoft.com/v1.0/me/drive/root:/${seg(folder)}`;
  async function g(url, opt){
    const tok = await msToken();
    const r = await fetch(url, { ...(opt || {}), headers: { Authorization: "Bearer " + tok, ...((opt || {}).headers || {}) } });
    if (r.status === 401) { const e = new Error("Lejárt bejelentkezés"); e.auth = true; throw e; }
    return r;
  }
  return {
    kind: "graph", label: "OneDrive / " + folder,
    async head(){ const r = await g(`${base}/${FILE}?select=eTag`); if (r.status === 404) return null; if (!r.ok) throw new Error("OneDrive HTTP " + r.status); return (await r.json()).eTag; },
    async read(){
      const r = await g(`${base}/${FILE}?select=eTag,@microsoft.graph.downloadUrl`); if (r.status === 404) return null;
      if (!r.ok) throw new Error("OneDrive HTTP " + r.status);
      const meta = await r.json();
      const c = await fetch(meta["@microsoft.graph.downloadUrl"], { cache: "no-store" });
      if (!c.ok) throw new Error("Letöltési hiba " + c.status);
      return { data: normalize(JSON.parse(await c.text())), ver: meta.eTag };
    },
    async write(txt, cur){
      const h = { "Content-Type": "application/json" }; if (cur) h["If-Match"] = cur;
      const r = await g(`${base}/${FILE}:/content`, { method: "PUT", headers: h, body: txt });
      if (r.status === 412 || r.status === 409) { const e = new Error("Ütközés"); e.conflict = true; throw e; }
      if (!r.ok) throw new Error("OneDrive HTTP " + r.status);
      return (await r.json()).eTag;
    },
    async backup(){
      if (LS.get("bk.graph", "") === today()) return;
      const r = await g(`${base}/${FILE}?select=@microsoft.graph.downloadUrl`); if (!r.ok) return;
      const c = await fetch((await r.json())["@microsoft.graph.downloadUrl"], { cache: "no-store" }); if (!c.ok) return;
      const put = await g(`${base}/mentesek/budget-${today()}.json:/content?@microsoft.graph.conflictBehavior=fail`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: await c.text() });
      if (put.ok || put.status === 409) LS.set("bk.graph", today());
    },
    async writeFile(sub, name, body, type){ const r = await g(`${base}/${seg(sub)}/${encodeURIComponent(name)}:/content`, { method: "PUT", headers: { "Content-Type": type || "text/plain" }, body }); if (!r.ok) throw new Error("OneDrive HTTP " + r.status); },
    async fileUrl(path){ const r = await g(`${base}/${seg(path)}?select=@microsoft.graph.downloadUrl`); if (!r.ok) throw new Error("OneDrive HTTP " + r.status); return (await r.json())["@microsoft.graph.downloadUrl"]; }
  };
}

function changes(series){
  if (!series || series.length < 2) return null;
  const [lastD, last] = series[series.length - 1];
  const at = days => { const t = Date.parse(lastD) - days * 864e5; let v = null; for (const [d, x] of series) if (Date.parse(d) <= t) v = x; return v; };
  const pct = v => v ? (last / v - 1) * 100 : null;
  return { d: pct(series[series.length - 2][1]), w: pct(at(7)), m: pct(at(30)) };
}

/* Tartozás: a megadott egyenleg a „from” hónap törlesztése UTÁN értendő.
   Csökkenti: a későbbi hónapok törlesztő sora, a hitelre jelölt eseti törlesztések. Növeli: a kártyás költés és a díj (napló). */
/* a kártya összes mozgása most: költés (s), napló-költés (l), díj (f), eseti törlesztés / visszatérítés (x); amt = hatás a tartozásra */
function debtMoves(dt){
  const out = [];
  for (const sp of spends()) if (sp.pay === dt.id && (sp.who || "geza") === "geza") out.push({ key: "s:" + sp.id, t: "s", at: sp.at, u: sp.u, txt: sp.shop || (sp.lines[0] || {}).n || "Költés", amt: spendHuf(sp) });
  for (const [lid, l] of Object.entries(dt.log || {})) out.push({ key: "l:" + lid, t: l.t === "fee" ? "f" : "l", at: l.at, u: l.at, txt: (l.t === "fee" ? "Díj" : "Költés") + (l.note ? ": " + l.note : ""), amt: +l.amt || 0 });
  for (const k of monthKeys()) for (const [xid, x] of Object.entries(month(k).extras)) if (x.debt === dt.id) out.push({ key: "x:" + k + "/" + xid, t: "x", k, at: x.at || x.u, u: x.u, txt: x.inc ? "Visszatérítés: " + (x.name || "") : "Eseti törlesztés", amt: -(+(x.a ?? x.p) || 0) });
  return out;
}
/* az egyenleg rögzítésekor beszámított mozgások pillanatképe: így a később módosított vagy törölt tétel különbsége is látszik */
function debtSnap(dt){ const o = {}; for (const m of debtMoves(dt)) o[m.key] = { a: Math.round(m.amt), t: m.txt }; return o; }
/* az utolsó egyenleg-megadás óta: új, módosított és törölt tételek */
function debtPending(dt){
  const base = dt.baseAt || "", rows = [], moves = debtMoves(dt);
  if (!dt.snap) {   // régi rögzítés (pillanatkép nélkül): ami az egyenleg megadása után került be
    for (const m of moves) if ((m.at || "") > base) rows.push({ at: m.at, txt: m.txt, amt: m.amt, t: m.t });
  } else {
    const seen = new Set();
    for (const m of moves) {
      const p = dt.snap[m.key]; seen.add(m.key);
      if (!p) rows.push({ at: m.at, txt: m.txt, amt: m.amt, t: m.t });
      else if (Math.abs(Math.round(m.amt) - p.a) >= 1) rows.push({ at: m.u || m.at, txt: `Módosítva: ${m.txt} (${fmt(Math.abs(p.a), { noUnit: true })} → ${fmt(Math.abs(m.amt), { noUnit: true })})`, amt: m.amt - p.a, t: m.t });
    }
    for (const [key, p] of Object.entries(dt.snap)) if (!seen.has(key) && p.a) rows.push({ at: D().deleted[key[0] === "s" ? "spend/" + key.slice(2) : key[0] === "x" ? "months/" + key.slice(2).replace("/", "/extras/") : ""] || "", txt: "Törölve: " + p.t, amt: -p.a, t: key[0] });
  }
  rows.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  return { rows, sum: rows.reduce((s, r) => s + r.amt, 0) };
}
function debtParts(dt){
  const cur = currentMk(), from = dt.from || "2026-02", base = dt.baseAt || "";
  let paid = 0, extra = 0, charge = 0, fee = 0;
  for (const k of monthKeys()) {
    if (k > cur) continue;
    const mo = month(k);
    if (k > from && dt.item) { const ln = mo.lines[dt.item]; if (ln) paid += ln.a != null ? +ln.a : (k < cur ? +ln.p || 0 : 0); }
    if (!dt.snap && k >= from) for (const x of Object.values(mo.extras)) if (x.debt === dt.id && (k > from || (x.at || x.u || "") > base)) extra += +(x.a ?? x.p) || 0;
  }
  if (dt.snap) { for (const r of debtPending(dt).rows) { if (r.t === "x") extra -= r.amt; else if (r.t === "f") fee += r.amt; else charge += r.amt; } }
  else {
    for (const l of Object.values(dt.log || {})) if ((l.at || "") > base) { if (l.t === "fee") fee += +l.amt || 0; else charge += +l.amt || 0; }
    for (const s of spends()) if (s.pay === dt.id && (s.who || "geza") === "geza" && (s.at || "") > base) charge += spendHuf(s);   // kártyával fizetett rögzített költés
  }
  const rem = Math.max((+dt.start || 0) - paid - extra + charge + fee, 0);
  return { rem, paid, extra, charge, fee };
}
function debtRemaining(dt){ return debtParts(dt).rem; }
/* az egyenleg megadásakor melyik hónap törlesztése van már benne: ha az aktuális havi sor ki van fizetve, az aktuális, különben az előző */
function debtAutoFrom(dt){
  const cur = currentMk(), ln = dt.item && month(cur) ? month(cur).lines[dt.item] : null;
  return ln && (ln.a != null || ln.done) ? cur : mkAdd(cur, -1);
}
/* új egyenleg rögzítése: a megadott (vagy a számított) tartozás lesz a kiinduló, a függő tételek beszámítva */
function debtSetBalance(dt, v){ dt.start = Math.max(0, Math.round(v)); dt.baseAt = nowIso(); dt.from = debtAutoFrom(dt); dt.snap = debtSnap(dt); stamp(dt); }
function debtForecast(dt){
  const rem = debtRemaining(dt); if (!rem) return { rem, end: null, monthly: 0 };
  const cur = currentMk(), nx = month(mkAdd(cur, 1)), cl = month(cur) && dt.item ? month(cur).lines[dt.item] : null;
  const monthly = (nx && dt.item && nx.lines[dt.item] && +nx.lines[dt.item].p) || (cl && +cl.p) || 0;
  if (!monthly) return { rem, end: null, monthly: 0 };
  const n = Math.ceil(rem / monthly), paidNow = cl && (cl.a != null || cl.done);
  return { rem, monthly, end: mkAdd(cur, paidNow ? n : n - 1) };
}
/* a Revolut forintegyenlege a főlapon megadott érték (a legutóbbi hónapból, amelyben van) */
function revolutNow(){
  const cur = currentMk();

}
function assetTotals(){
  const A = D().assets, t = { raif: 0, rev: 0, stock: 0, crypto: 0, HUF: 0, EUR: 0, USD: 0, debts: 0 };
  for (const [id, a] of Object.entries(A.accounts)) for (const cur of ["HUF","EUR","USD"]) {
    const amt = id === "rev" && cur === "HUF" ? (revolutNow() ?? +a.bal.HUF ?? 0) : (+a.bal[cur] || 0);
    const v = (amt || 0) * fx(cur); t[id] = (t[id] || 0) + v; t[cur] += v;
  }
  t.stockUsd = 0; t.cryptoUsd = 0;
  for (const s of Object.values(A.stocks)) t.stockUsd += (+s.qty || 0) * stockPrice(s);
  for (const c of Object.values(A.crypto)) t.cryptoUsd += (+c.qty || 0) * cryptoPrice(c);
  t.stock = t.stockUsd * fx("USD"); t.crypto = t.cryptoUsd * fx("USD");
  t.revHuf = revolutNow() || 0;
  for (const d of Object.values(A.debts)) t.debts += debtRemaining(d);
  t.total = t.HUF + t.EUR + t.USD + t.stock + t.crypto;
  t.net = t.total - t.debts;
  return t;
}

function itemScAuto(it){
  const n = " " + fold(it.name) + " ", has = re => re.test(n);
  if (Object.values(D().assets.debts || {}).some(d => d.item === it.id) || has(/hitelkartya/)) return "hitel.kartya";
  if (it.cat === "megt") return has(/hitel|torleszt/) ? "lak.fund" : "megt.megt";
  if (it.cat === "dig") return "komm.dig";
  if (it.cat === "vall") return has(/ado/) ? "vall.ado" : "vall.kam";
  if (has(/ gaz /)) return "rezsi.gaz";
  if (has(/villany|aram/)) return "rezsi.villany";
  if (has(/ viz |csatorna/)) return "rezsi.viz";
  if (has(/hulladek|szemet/)) return "rezsi.hull";
  if (has(/egeszsegpenztar|\bep\b/)) return "megt.ep";
  if (has(/kgfb|casco|gepjarmu|kotelezo/)) return "koz.bizt";
  if (has(/biztositas/)) return "eg.bizt";
  if (has(/telefon|internet|mobil| net |telekom|telenor|vodafone|yettel|digi /)) return "komm.tel";
  if (has(/fundamenta|lakastakarek|lakashitel|jelzalog|torleszto/)) return "lak.fund";
  if (has(/uzemanyag|benzin|tankol/)) return "koz.uza";
  if (has(/ ado /) && (it.cat === "csal" || has(/auto/))) return "koz.ado";
  if (it.cat === "gyer") return has(/zsebpenz/) ? "gyer.zseb" : has(/berlet/) ? "gyer.berl" : has(/edzes|kulonora|balett|tanc|uszas|foci|zene|sport/) ? "gyer.edz" : has(/iskola|tandij|etkezes|menza|ovoda/) ? "gyer.isk" : "gyer.vas";
  if (has(/hobbi/)) return "hobbi.retro";
  return guessSc(it.name) || "egyeb.egyeb";

function guessSc(text){
  const t = " " + fold(text).replace(/hot dog/g, "hotdog") + " ";
  const learn = D().learn || {};
  // 1) saját szótár: teljes név, aztán szavanként
  const full = fold(text); if (learn[full]) return learn[full].sc;
  for (const w of full.split(" ")) if (w.length > 2 && learn[w]) return learn[w].sc;
  // 2) beépített kulcsszavak
  for (const [sc, ws] of KW) for (const w of ws) if (w && t.includes(" " + w + " ")) return sc;
  for (const [sc, ws] of KW) for (const w of ws) if (w.length >= 5 && t.includes(w)) return sc;
  return null;
}
function learnSc(name, sc){
  const full = fold(name); if (!full || !SUBS[sc]) return;
  D().learn = D().learn || {};
  D().learn[full] = { sc, u: nowIso() };
  const first = full.split(" ").find(w => w.length > 2 && !/^\d+$/.test(w));
  if (first && first !== full) D().learn[first] = { sc, u: nowIso() };
}
function scOptions(sel, nsToo){
  return TAX.filter(g => nsToo || !g.ns).map(g => `<optgroup label="${esc(g.name)}">${g.subs.map(([s, n]) => { const id = g.id + "." + s; return `<option value="${id}" ${id === sel ? "selected" : ""}>${esc(n)}</option>`; }).join("")}</optgroup>`).join("");
}

const PAY = () => [["rev","Revolut"],["raif","Raiffeisen"],["cash","Készpénz"],["ep","Egészségpénztár"], ...Object.values(D().assets.debts).map(d => [d.id, d.name + "-kártya"])];

const CURS = ["HUF","EUR","USD"];
const curSym = c => c === "HUF" ? "Ft" : c === "EUR" ? "€" : "$";
function mkOfDate(ds){ return mkOfDateStr(ds || today()); }
const spends = () => Object.entries(D().spend || {}).map(([id, s]) => ({ ...s, id }));
function spendHuf(s){ return Math.round((s.lines || []).reduce((a, l) => a + (+l.a || 0), 0) * (s.rate || 1)); }
function spendsOf(k, who){ return spends().filter(s => mkOfDate(s.d) === k && (!who || (s.who || "geza") === who)).sort((a, b) => (b.d || "").localeCompare(a.d || "") || (b.at || "").localeCompare(a.at || "")); }
/* a keretből: a Revolut-egyenleg megadása után rögzített, Revolutról fizetett saját költések */
function spendRevAfter(k){
  const mo = month(k); if (!mo || !mo.meta.revAt) return { sum: 0, n: 0 };
  const at = mo.meta.revAt, day = at.slice(0, 10);
  let sum = 0, n = 0;
  for (const s of spendsOf(k, "geza")) if (s.pay === "rev" && (s.at || "") > at && (s.d || "") >= day) { sum += spendHuf(s); n++; }
  return { sum, n };
}
/* a Revolut-egyenleg megadása után érkezett eseti bevételek (pl. visszatérítés Revolutra) */
function incomeRevAfter(k){
  const mo = month(k); if (!mo || !mo.meta.revAt) return { sum: 0, n: 0 };
  let sum = 0, n = 0;
  for (const x of Object.values(mo.extras)) if (x.inc && x.to === "rev" && (x.at || "") > mo.meta.revAt) { sum += +x.a || 0; n++; }
  return { sum, n };
}

  const hint = () => { const h = $("#iHint"); if (!h) return; const dt = D().assets.debts[to];
    h.textContent = to === "rev" ? "A Szabadon elkölthető keretbe beszámítom; a Revolut-egyenlegnél rákérdezek, hozzáadjam-e." : dt ? `${dt.name}: csökkenti a kártya tartozását.` : to === "ep" ? "Az egészségpénztár egyenlegéhez adom (100%)." : "Csak a havi bevételhez számít."; };
  setTimeout(hint, 0);
  DR.handler = (what) => {
    if (what.startsWith("to:")) { to = what.slice(3); document.querySelectorAll("#iTo button").forEach(b => b.setAttribute("aria-pressed", b.dataset.dr === what)); return hint(); }

    if (what === "save") {
      const v = parseAmt($("#iA").value); if (!v || Number.isNaN(v)) return toast("Adj meg összeget.");
      const name = $("#iN").value.trim() || "Eseti bevétel", dt = D().assets.debts[to];
      const rec = { name, p: 0, a: v, done: true, cat: catOrder().find(c => c.kind === "income").id, inc: true, to, d: $("#iD").value || today(), at: old ? old.at : nowIso() };
      if (dt) rec.debt = dt.id;
      mo.extras[id || uid("x")] = stamp(rec); LS.set("lastIncTo", to);
      persist(); closeDrawer(); renderAll(); toast(`Bevétel: ${name}, ${fmt(v)} → ${payName(to)}`);
    }
  };
}

function toast(msg, undo, label){
  const el = $("#toast"); el.innerHTML = esc(msg) + (undo ? ` <button type="button">${esc(label || "Visszavonás")}</button>` : "");

  st(D().settings); D().cats.forEach(st); D().items.forEach(st); Object.values(D().spend || {}).forEach(st); Object.values(D().statmap || {}).forEach(st);

function download(name, text, type){

}

function catOrder(){ return D().cats.slice().sort((a,b) => (a.kind === "income" ? -1 : 0) - (b.kind === "income" ? -1 : 0)); }
function dueClass(l, k){
  if (!l.due || k !== currentMk()) return "";
  const per = period(k), t = new Date(); t.setHours(0,0,0,0);
  let d = new Date(per.start.getFullYear(), per.start.getMonth(), l.due); if (d < per.start) d = new Date(per.start.getFullYear(), per.start.getMonth() + 1, l.due);
  const diff = (d - t) / 864e5; return diff < 0 ? "late" : diff <= 3 ? "soon" : "";
}
function dueSortKey(l){ if (!l.due) return 99; const sd = startDay(); return l.due >= sd ? l.due - sd : l.due + 31 - sd; }
function chgChip(label, v){
  if (v == null || isNaN(v)) return `<span class="chg"><span class="lb">${label}</span> –</span>`;

    if (what.startsWith("t:")) { t = what.slice(2); document.querySelectorAll('#drawer .seg button').forEach(b => b.setAttribute("aria-pressed", b.dataset.dr === what)); $("#dbPay").hidden = t !== "pay"; $("#dbInfo").hidden = t === "pay"; return; }

      } else {

      }

}
function debtLogHtml(dt){
  const base = dt.baseAt || "";
  const rows = [];
  for (const [lid, l] of Object.entries(dt.log || {})) rows.push({ at: l.at, txt: `${l.t === "fee" ? "Díj" : "Költés"}${l.note ? ": " + esc(l.note) : ""}`, amt: +l.amt, lid, old: dt.snap ? !!dt.snap["l:" + lid] : (l.at || "") <= base });
  for (const k of monthKeys()) for (const x of Object.values(month(k).extras)) if (x.debt === dt.id) rows.push({ at: x.at || x.u, txt: esc(x.name), amt: -(+(x.a ?? x.p) || 0) });
  for (const s of spends()) if (s.pay === dt.id && (s.who || "geza") === "geza") rows.push({ at: s.at, txt: "Költés: " + esc(s.shop || (s.lines[0] || {}).n || ""), amt: spendHuf(s), old: dt.snap ? !!dt.snap["s:" + s.id] : (s.at || "") <= base });
  if (!rows.length) return "";
  rows.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  return `<div><div class="k" style="margin-bottom:6px">Napló</div>${rows.slice(0, 12).map(r => `<div style="display:flex;gap:8px;align-items:center;font-size:13.5px;padding:4px 0;border-top:1px solid var(--line-2);${r.old ? "opacity:.5" : ""}"><span class="muted num" style="font-size:12px">${r.at ? new Date(r.at).toLocaleDateString("hu-HU", { month: "2-digit", day: "2-digit" }) : ""}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.txt}</span><span class="num ${r.amt > 0 ? "neg" : "pos"}">${r.amt > 0 ? "+" : "−"}${fmt(Math.abs(r.amt), { noUnit: true })}</span>${r.lid ? `<button class="icon-btn" data-dr="rm:${r.lid}" aria-label="Törlés">${ICON.trash}</button>` : ""}</div>`).join("")}${rows.some(r => r.old) ? `<p class="muted small" style="margin:6px 0 0">A halvány tételek már benne vannak a legutóbb rögzített egyenlegben; ha utólag módosítod őket, a különbség függő tételként jelenik meg.</p>` : ""}</div>`;
}
function getRaw(k, kind, id){ const mo = month(k); return kind === "extra" ? mo.extras[id] : mo.lines[id]; }
function setLine(k, kind, id, patch){
  const mo = month(k), box = kind === "extra" ? mo.extras : mo.lines;
  const cur = box[id] || { p: 0 };
  const n = { ...cur, ...patch };
  for (const key of Object.keys(n)) if (n[key] === null || n[key] === undefined || n[key] === false || n[key] === "") delete n[key];
  if (n.p == null) n.p = 0;
  if (n.a != null || n.done) { if (!n.paidAt) n.paidAt = nowIso(); } else delete n.paidAt;   // mikor lett kifizetve (az EP-egyenleghez)
  box[id] = stamp(n);
  persist(); renderAll();
}
function payLine(k, kind, id){
  const raw = getRaw(k, kind, id) || { p: 0 };
  const before = JSON.stringify(raw);
  const a = raw.a != null && raw.a > 0 ? raw.a : raw.p;
  setLine(k, kind, id, { a, done: true });
  const nm = kind === "extra" ? raw.name : (itemById(id) || {}).name;
  toast(`${nm}: kifizetve, ${fmt(a)}`, () => { const mo = month(k), box = kind === "extra" ? mo.extras : mo.lines; box[id] = stamp(JSON.parse(before)); persist(); renderAll(); });
}

const blocks = (v, max, w) => { const n = max > 0 ? Math.max(0, Math.min(w, Math.round(v / max * w))) : 0; return "█".repeat(n) + "░".repeat(w - n); };
const ftn = v => fmt(v, { noUnit: true });
function menuRight(){
  const el = $("#mbRight"); if (!el || !S.data) return;
  const k = currentMk(), per = period(k), left = Math.round((per.end - new Date().setHours(0,0,0,0)) / 864e5) + 1;
  el.textContent = `${mkName(k)} · ${dshort(per.start)}–${dshort(per.end)} · még ${left} nap`;
}
/* a tervezett tétel dátuma: a terhelés napja az időszakon belül, ennek hiányában az időszak első napja */
function lineDate(k, due){
  const per = period(k); if (!due) return dstr(per.start);
  let d = new Date(per.start.getFullYear(), per.start.getMonth(), due); if (d < per.start) d = new Date(per.start.getFullYear(), per.start.getMonth() + 1, due);
  if (d > per.end) d = per.end; return dstr(d);
}
const lineKey = l => l.kind + ":" + l.id;
const lineInc = l => isIncomeCat(l.cat);
const lineOk = l => lineInc(l) ? l.a != null : l.done;

/* kifizetve ↔ nincs kifizetve (bevételnél: beérkezett ↔ nem) */
function toggleLine(k, kind, id){
  const mo = month(k); if (!mo) return;
  const raw = getRaw(k, kind, id) || { p: 0 };
  const cat = kind === "extra" ? (raw.cat || "eseti") : (itemById(id) || {}).cat, inc = isIncomeCat(cat);
  const ok = inc ? raw.a != null : !!raw.done;
  if (!ok) return payLine(k, kind, id);
  const before = JSON.stringify(raw), nm = kind === "extra" ? raw.name : (itemById(id) || {}).name;
  setLine(k, kind, id, inc ? { a: null, done: false } : { done: false, ...(raw.a == null || +raw.a === +raw.p ? { a: null } : {}) });
  toast(`${nm}: ${inc ? "nem érkezett be" : "nincs kifizetve"}`, () => { const box = kind === "extra" ? mo.extras : mo.lines; box[id] = stamp(JSON.parse(before)); persist(); renderAll(); });
}

function markSel(){ document.querySelectorAll("#view-month .pr.sel").forEach(x => x.classList.remove("sel")); const el = S.sel && document.querySelector(`#view-month .pr[data-line="${CSS.escape(S.sel)}"]`); if (el) { el.classList.add("sel"); el.scrollIntoView({ block: "nearest" }); } }

    if (act === "mprev") { S.mk = mkAdd(S.mk, -1); return renderMonth(); }
    if (act === "mnext") { S.mk = mkAdd(S.mk, 1); return renderMonth(); }
    if (act === "mtoday") { S.mk = currentMk(); return renderMonth(); }
    if (act === "mcreate") { D().months[S.mk] = newMonthFrom(S.mk); persist(); renderAll(); return toast("Terv létrehozva."); }
    if (act === "addextra") return openExtraNew(S.mk);
    if (act === "addincome") return openIncome(S.mk);
    if (act === "reka") return openReka(S.mk);
    if (act === "px") return refreshPrices(false);
    if (act === "debt") return openDebtDetail(a.dataset.id);
    if (act === "debtnew") return openDebtNew();
    if (act === "ep") return openEpDetail();
    if (act === "revbook" || act === "revinc") {
      const mo = month(S.mk), c = calc(S.mk), m = { ...mo.meta };
      if (act === "revbook") { m.revolut = c.revolut - c.spendRev.sum + c.incRev.sum; }
      m.revAt = nowIso();
      return withUndo(act === "revbook" ? `Revolut-egyenleg: ${fmt(m.revolut)}.` : "A tételek már benne voltak az egyenlegben.", () => { mo.meta = stamp(m); });
    }
    if (act === "perset") return openPeriod(S.mk);
    if (act === "mclose") return openClose(S.mk);
    if (act === "mreopen") { const mo = month(S.mk); mo.meta = stamp({ ...mo.meta, closed: false }); persist(); return renderAll(); }
    return;
  }
  if (e.target.closest("input,label")) return;
  const r = e.target.closest("[data-line]");
  if (r) { S.sel = r.dataset.line; const [kind, id] = r.dataset.line.split(/:(.*)/s); const x = kind === "extra" && month(S.mk).extras[id]; if (x && x.inc) return openIncome(S.mk, id); openLine(S.mk, kind, id); }
});

/* shared change handler for inline inputs */
document.addEventListener("change", e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  const parts = f.split("|");
  const numv = () => { const v = parseAmt(el.value); if (Number.isNaN(v)) { toast("Nem értelmezhető szám."); return undefined; } return v; };
  if (f === "rev-bal") { const v = numv(); if (v === undefined) return; const mo = month(S.mk); const m = { ...mo.meta }; if (v == null) { delete m.revolut; delete m.revAt; } else { m.revolut = v; m.revAt = nowIso(); } mo.meta = stamp(m); persist(); return renderAll(); }
  const A = D().assets;
  if (parts[0] === "acct") { const v = numv(); if (v === undefined) return; const a = A.accounts[parts[1]]; a.bal = { ...a.bal, [parts[2]]: v }; stamp(a); persist(); return renderAll(); }
  if (parts[0] === "stock" || parts[0] === "crypto" || parts[0] === "debt") {
    const g = { stock: "stocks", crypto: "crypto", debt: "debts" }[parts[0]], o = A[g][parts[1]], fld = parts[2];
    if (["qty","start","limit"].includes(fld)) { const v = numv(); if (v === undefined) return; if (fld === "limit" && v == null) delete o.limit; else o[fld] = v; if (fld === "start") { o.baseAt = nowIso(); o.from = debtAutoFrom(o); o.snap = debtSnap(o); } }
    else if (fld === "from") { o.from = el.value; o.baseAt = nowIso(); o.snap = debtSnap(o); }
    else if (fld === "usd") { const v = numv(); if (v === undefined) return; if (v == null) { o.manual = false; } else { o.usd = v; o.manual = true; o.usdAt = nowIso(); } }
    else o[fld] = el.value.trim();
    stamp(o); persist(); return renderAll();
  }
  if (parts[0] === "item") {
    const it = itemById(parts[1]), fld = parts[2];
    if (fld === "name") it.name = el.value.trim() || it.name;
    else if (fld === "due") { const v = parseInt(el.value, 10); if (v >= 1 && v <= 31) it.due = v; else delete it.due; }
    else if (fld === "plan") { const v = numv(); if (v === undefined) return; if (v == null) delete it.plan; else it.plan = v; syncItemPlan(it); }
    else if (fld === "rule") { delete it.rule; delete it.months; delete it.dates; if (el.value === "week") it.rule = { perMonday: it.plan || 0 }; if (el.value === "year") it.months = []; if (el.value === "dates") it.dates = [];
      if (el.value === "year" || el.value === "dates") { stamp(it); persist(); renderAll(); return openMonthPick(it.id); } }
    else if (fld === "param") { const v = numv(); if (v === undefined) return; if (it.rule) it.rule = { perMonday: v || 0 }; }
    else if (fld === "rev") { if (el.checked) it.rev = true; else delete it.rev; }
    else if (fld === "off") { if (!el.checked) it.off = true; else delete it.off; }
    else if (fld === "cat") it.cat = el.value;
    stamp(it); persist(); return renderAll();
  }
  if (parts[0] === "set") {
    const st = D().settings, fld = parts[1];
    if (["rekaPct","rekaRound","startDay","fxUSD","fxEUR"].includes(fld)) { const v = numv(); if (v === undefined) return; if (v == null) delete st[fld]; else st[fld] = v; }
    else if (el.type === "checkbox") st[fld] = el.checked;
    else st[fld] = el.value.trim();
    stamp(st); persist(); return renderAll();
  }
});

/* a havi EP-befizetés tétele: amelyik a statisztikában „Egészségpénztár-befizetés” */
function epItem(){ return items().find(it => !it.off && itemSc(it) === "megt.ep") || items().find(it => itemSc(it) === "megt.ep") || null; }
/* az egyenleg megadása óta: kifizetett havi befizetések, eseti befizetések, adó-visszatérítés, EP-ből fizetett költések */
function epPending(){
  const ep = EP(); if (!ep) return { rows: [], sum: 0 };
  const base = ep.baseAt || "", rows = [], it = epItem(), r = epRate();
  if (it) for (const k of monthKeys()) { const ln = month(k).lines[it.id]; if (ln && ln.paidAt && ln.paidAt > base) { const v = +(ln.a ?? ln.p) || 0; if (v) rows.push({ at: ln.paidAt, txt: `Havi befizetés (${mkShort(k)}): ${fmt(v)} × ${fmtN(r * 100, 1)}%`, amt: Math.round(v * r) }); } }
  for (const [lid, l] of Object.entries(ep.log || {})) if ((l.at || "") > base) rows.push({ at: l.at, lid, txt: l.t === "tax" ? "Adó-visszatérítés" : `Eseti befizetés: ${fmt(l.amt)} × ${fmtN(r * 100, 1)}%`, amt: l.t === "tax" ? +l.amt : Math.round(+l.amt * r) });
  for (const k of monthKeys()) for (const x of Object.values(month(k).extras)) if (x.inc && x.to === "ep" && (x.at || "") > base) rows.push({ at: x.at, txt: "Bevétel: " + (x.name || ""), amt: +x.a || 0 });
  for (const s of spends()) if (s.pay === "ep" && (s.who || "geza") === "geza" && (s.at || "") > base) rows.push({ at: s.at, txt: s.shop || (s.lines[0] || {}).n || "Költés", amt: -spendHuf(s) });
  rows.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  return { rows, sum: rows.reduce((x, y) => x + y.amt, 0) };
}
function epBalance(){ const ep = EP(); return ep && ep.start != null ? (+ep.start || 0) + epPending().sum : null; }
function epSet(v){ D().assets.ep = stamp({ ...(EP() || {}), start: Math.round(v), baseAt: nowIso(), log: {} }); }
function epBody(){
  const ep = EP(), bal = epBalance(), pd = epPending();
  return `<div class="dbody">
      ${pd.rows.length ? `<div class="pendbox"><div class="k">Az egyenleg megadása óta${ep && ep.baseAt ? " (" + new Date(ep.baseAt).toLocaleDateString("hu-HU", { month: "short", day: "numeric" }) + ")" : ""}: ${pd.sum >= 0 ? "+" : "−"}${fmt(Math.abs(pd.sum))}</div>
        ${pd.rows.slice(0, 8).map(r => `<div class="prow"><span class="muted num">${new Date(r.at).toLocaleDateString("hu-HU", { month: "2-digit", day: "2-digit" })}</span><span class="t">${esc(r.txt)}</span><span class="num ${r.amt >= 0 ? "pos" : "neg"}">${r.amt >= 0 ? "+" : "−"}${fmt(Math.abs(r.amt), { noUnit: true })}${r.lid ? ` <button class="icon-btn" data-act="eprm" data-id="${r.lid}" aria-label="Törlés">${ICON.trash}</button>` : ""}</span></div>`).join("")}
        <p class="muted small" style="margin:6px 0 0">Ezek már benne vannak a fenti egyenlegben. Ha a pénztár szerint is így áll, könyveld be; ha a megadott egyenleg már tartalmazta őket, jelöld így.</p>
        <div class="actions" style="justify-content:flex-start"><button class="btn sm primary" data-act="epbook">${ICON.check} Bekönyvelem</button><button class="btn sm" data-act="epinc">Már benne volt</button></div></div>` : ""}
      ${bal != null ? `<div class="two"><div class="field"><label for="epX">Eseti befizetés (bruttó)</label><div class="addline"><input class="inp num" id="epX" inputmode="numeric" placeholder="Ft"><button class="btn" data-act="epx">Hozzáad</button></div></div>
        <div class="field"><label for="epT">Adó-visszatérítés</label><div class="addline"><input class="inp num" id="epT" inputmode="numeric" placeholder="Ft"><button class="btn" data-act="ept">Hozzáad</button></div></div></div>` : ""}
      <div class="field"><label for="epB">Egyenleg a pénztár szerint</label><div class="addline"><input class="inp num" id="epB" inputmode="numeric" placeholder="${bal == null ? "Ft" : Math.round(bal)}"><button class="btn" data-act="epbal">Rögzítés</button></div>
        <span class="muted small">A havi befizetés ${fmtN(epRate() * 100, 1)}%-a kerül a számlára (fedezeti tartalék); ezt magától számolom, amikor a havi sort (${esc((epItem() || { name: "EP" }).name)}) kifizetettnek jelölöd. Az adó-visszatérítés 100%-ban jóváíródik. A hozamot évente az egyenlegközlő alapján írd be ide.</span></div>
    </div>`;
}
function epCard(){
  const bal = epBalance(), pd = epPending(), open = !!S.open["ep"];
  return `<div class="card"><details class="dcard epcard" data-ep ${open ? "open" : ""}><summary><span class="day">${ICON.heart}</span><span class="nm">Egészségpénztár<span class="sub">${bal == null ? "add meg a mostani egyenleget" : "külön számla, a teljes vagyonba nem számít"}</span></span>
      <span class="amt num">${bal == null ? "–" : fmt(bal)}${pd.rows.length ? `<span class="pend" title="Az utolsó egyenleg-megadás óta">${pd.sum >= 0 ? "+" : "−"}${fmt(Math.abs(pd.sum), { noUnit: true })}</span>` : ""}</span><span></span></summary>
    ${epBody()}</details></div>`;
}
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.epcard")) S.open["ep"] = e.target.open; }, true);
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act^=ep]"); if (!a || !a.closest(".epcard")) return;
  e.preventDefault(); S.open["ep"] = true;
  const act = a.dataset.act, card = a.closest(".epcard"), val = sel => { const v = parseAmt(card.querySelector(sel).value); return v == null || Number.isNaN(v) ? null : v; };
  if (act === "epbal") { const v = val("#epB"); if (v == null) return toast("Add meg az egyenleget."); return withUndo(`Egészségpénztár: egyenleg ${fmt(v)}.`, () => epSet(v)); }
  if (act === "epbook") { const b = epBalance(); return withUndo(`Egészségpénztár: bekönyvelve, ${fmt(b)}.`, () => epSet(b)); }
  if (act === "epinc") { const b = epBalance() - epPending().sum; return withUndo("Egészségpénztár: a tételek már benne voltak.", () => epSet(b)); }
  if (act === "epx" || act === "ept") {
    const v = val(act === "epx" ? "#epX" : "#epT"); if (!v) return toast("Adj meg összeget.");
    const ep = EP(); D().assets.ep = stamp({ ...ep, log: { ...(ep.log || {}), [uid("e")]: { t: act === "ept" ? "tax" : "extra", amt: v, at: nowIso() } } });
    persist(); renderAll(); return toast(act === "ept" ? `Adó-visszatérítés: +${fmt(v)}` : `Eseti befizetés: ${fmt(v)}, jóváírás ${fmt(Math.round(v * epRate()))}`);
  }
  if (act === "eprm") { const ep = EP(), log = { ...(ep.log || {}) }; delete log[a.dataset.id]; D().assets.ep = stamp({ ...ep, log }); persist(); return renderAll(); }
});

/* ================= charts (inline SVG) ================= */
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceStep(max){ const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p; return 10 * p; }
const kFmt = v => v >= 1e6 ? (v / 1e6).toLocaleString("hu-HU", { maximumFractionDigits: 1 }) + " M" : v >= 1e4 ? Math.round(v / 1000) + " e" : v >= 1000 ? (v / 1000).toLocaleString("hu-HU", { maximumFractionDigits: 1 }) + " e" : String(Math.round(v));
function stackedBars(el, cols, series, opt){
  // cols: [{key,label,cur,values:{sid:v}}], series: [{id,name,color}]
  const W = 720, H = 250, ml = 44, mr = 6, mt = 10, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  const tot = c => series.reduce((s, x) => s + Math.max(c.values[x.id] || 0, 0), 0);
  const max = Math.max(1000, ...cols.map(tot)), step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = iw / cols.length, bar = Math.min(38, bw * 0.62);
  const y = v => mt + ih - v / top * ih;
  let g = "";
  for (let v = 0; v <= top + step / 2; v += step) g += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v ? kFmt(v) : "0"}</text>`;
  let bars = "", defs = "";
  cols.forEach((c, i) => {
    const x = ml + i * bw + (bw - bar) / 2, t = tot(c);
    if (t > 0) {
      defs += `<clipPath id="cp${opt.id}${i}"><rect x="${x}" y="${y(t)}" width="${bar}" height="${ih - (y(t) - mt) + 6}" rx="4"/></clipPath>`;
      let acc = 0, seg = "";
      for (const s of series) { const v = Math.max(c.values[s.id] || 0, 0); if (!v) continue; const y1 = y(acc + v), y0 = y(acc); seg += `<rect x="${x}" y="${y1}" width="${bar}" height="${Math.max(y0 - y1, 0)}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" paint-order="stroke"/>`; acc += v; }
      bars += `<g clip-path="url(#cp${opt.id}${i})">${seg}</g>`;
    }
    bars += `<text class="ax" x="${ml + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" ${c.cur ? 'style="font-weight:600;fill:var(--ink)"' : ""}>${esc(c.label)}</text>`;
    bars += `<rect class="hit" data-i="${i}" x="${ml + i * bw}" y="${mt}" width="${bw}" height="${ih}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}"><defs>${defs}</defs>${g}<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${bars}</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => {
    const h = e.target.closest(".hit"); if (!h) return tip.classList.remove("on");
    const c = cols[+h.dataset.i];
    tip.innerHTML = `<div class="h">${esc(c.full || c.label)}</div>` + series.filter(s => c.values[s.id]).slice().reverse().map(s => `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span class="num">${fmt(c.values[s.id])}</span></div>`).join("") + `<div class="r tot"><span>Összesen</span><span class="num">${fmt(tot(c))}</span></div>`;
    const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
    let lx = hb.left - box.left + hb.width / 2 + 12; if (lx + 190 > box.width) lx = hb.left - box.left + hb.width / 2 - 200;
    tip.style.left = Math.max(0, lx) + "px"; tip.style.top = "8px"; tip.classList.add("on");
  });
  svg.addEventListener("pointerleave", () => tip.classList.remove("on"));
}
function lineChart(el, pts, opt){
  const W = 720, H = 200, ml = 50, mr = 10, mt = 12, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  const vals = pts.map(p => p.v), lo0 = Math.min(...vals), hi0 = Math.max(...vals);
  const step = niceStep((hi0 - lo0) || hi0 || 1), lo = Math.floor(lo0 / step) * step, hi = Math.ceil(hi0 / step) * step || step;
  const x = i => ml + (pts.length === 1 ? iw / 2 : i / (pts.length - 1) * iw), y = v => mt + ih - (v - lo) / ((hi - lo) || 1) * ih;
  let g = ""; for (let v = lo; v <= hi + 1; v += step) g += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${kFmt(v)}</text>`;
  const path = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text><rect class="hit" data-i="${i}" x="${x(i) - iw / pts.length / 2}" y="${mt}" width="${iw / pts.length}" height="${ih}"/>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">${g}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => { const h = e.target.closest(".hit"); if (!h) return tip.classList.remove("on"); const p = pts[+h.dataset.i];
    tip.innerHTML = `<div class="h">${esc(p.full || p.label)}</div>${p.rows.map(r => `<div class="r"><span>${esc(r[0])}</span><span class="num">${fmt(r[1])}</span></div>`).join("")}`;
    const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect(); let lx = hb.left - box.left + hb.width / 2 + 12; if (lx + 190 > box.width) lx = hb.left - box.left + hb.width / 2 - 200;
    tip.style.left = Math.max(0, lx) + "px"; tip.style.top = "8px"; tip.classList.add("on"); });
  svg.addEventListener("pointerleave", () => tip.classList.remove("on"));
}

/* ================= year view ================= */
function renderYear(){
  const v = $("#view-year"), keys = monthKeys(), cur = currentMk(), mode = S.yearMode;
  if (!keys.length) { v.innerHTML = `<div class="mhead"><h1>Éves áttekintés</h1></div><p class="muted">Még nincs hónap. Hozz létre egyet a Hónap fülön.</p>`; return; }
  const rows = keys.map(k => ({ k, c: calc(k) }));
  const val = (o) => mode === "p" ? o.p : o.a;
  const tot = { inc: 0, exp: 0, bal: 0, reka: 0 };
  let h = `<div class="mhead"><h1>Éves áttekintés</h1><span class="per">${mkName(keys[0])} – ${mkName(keys[keys.length - 1])}</span><span class="spacer"></span>
    <div class="seg" role="group" aria-label="Nézet"><button data-act="ym" data-v="a" aria-pressed="${mode === "a"}">Tény / várható</button><button data-act="ym" data-v="p" aria-pressed="${mode === "p"}">Terv</button></div></div>`;
  const ecats = D().cats.filter(c => c.kind !== "income");
  const series = ecats.map((c, i) => ({ id: c.id, name: c.name, color: cssVar(SERIES[i % SERIES.length]) }));
  h += `<div class="grid"><div class="card"><div class="hd"><h2>Kiadások kategóriánként</h2><span class="muted small">${mode === "p" ? "terv" : "tény, a nyitott tételeknél a terv"}</span></div><div class="bd"><div class="chart" id="yChart"></div></div>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div></div>`;
  h += `<div class="card"><div class="hd"><h2>Havi összesítő</h2></div><div class="tblwrap"><table class="t"><thead><tr><th>Hónap</th><th>Bevétel</th><th>Kiadás</th><th>Egyenleg</th><th>${esc(partner())}</th><th>Keret</th></tr></thead><tbody>`;
  for (const { k, c } of rows) {
    tot.inc += val(c.inc); tot.exp += val(c.exp); tot.bal += val(c.bal); tot.reka += mode === "p" ? c.reka : (c.rekaPaid ?? c.reka);
    h += `<tr class="${k === cur ? "cur" : ""}"><td><a href="#" data-act="gomonth" data-k="${k}">${mkName(k)}</a>${month(k).meta.closed ? ' <span class="chip">lezárva</span>' : ""}</td>
      <td class="num">${fmt(val(c.inc), { noUnit: true })}</td><td class="num">${fmt(val(c.exp), { noUnit: true })}</td>
      <td class="num ${val(c.bal) < 0 ? "neg" : ""}">${fmt(val(c.bal), { noUnit: true })}</td><td class="num">${fmt(mode === "p" ? c.reka : (c.rekaPaid ?? c.reka), { noUnit: true })}</td>
      <td class="num">${c.keret == null ? "–" : fmt(c.keret, { noUnit: true })}</td></tr>`;
  }
  h += `</tbody><tfoot><tr><td>Összesen</td><td class="num">${fmt(tot.inc, { noUnit: true })}</td><td class="num">${fmt(tot.exp, { noUnit: true })}</td><td class="num">${fmt(tot.bal, { noUnit: true })}</td><td class="num">${fmt(tot.reka, { noUnit: true })}</td><td></td></tr></tfoot></table></div></div>`;
  // matrix
  const mm = S.matrix;
  h += `<div class="card"><div class="hd"><h2>Tételek havonta</h2><span class="spacer" style="flex:1"></span>
    <div class="seg"><button data-act="mx" data-v="p" aria-pressed="${mm === "p"}">Terv</button><button data-act="mx" data-v="a" aria-pressed="${mm === "a"}">Tény</button></div>
    <button class="btn sm" data-act="csv">CSV</button></div>
    <div class="bd muted small" style="padding-bottom:8px">Kattints egy cellára a szerkesztéshez. A ${mm === "p" ? "terv" : "tény"} értékét írod át.</div>
    <div class="tblwrap" style="max-height:70vh"><table class="t" id="mxT"><thead><tr><th>Tétel</th>${keys.map(k => `<th>${mkShort(k)}</th>`).join("")}<th>Össz.</th></tr></thead><tbody>`;
  for (const cat of catOrder()) {
    const its = items().filter(i => i.cat === cat.id && (!i.off || keys.some(k => month(k).lines[i.id])));
